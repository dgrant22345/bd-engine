<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BD Engine Cloud — Revenue intelligence platform for staffing and recruiting teams. Track accounts, hiring signals, and outreach in one place.">
  <meta name="application-name" content="BD Engine Cloud">
  <meta name="theme-color" content="#0a0e1a">
  <title>BD Engine Cloud | Revenue Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/cloud.css">
</head>
<body>
  <div id="cloud-root"></div>

  <script>
  (() => {
    const root = document.getElementById('cloud-root');

    // ── State ─────────────────────────────────────────────────────────────
    let state = {
      view: 'loading', // loading | landing | login | signup | forgot | reset | app | trust | privacy | terms | security | status
      user: null,
      tenant: null,
      tenants: [],
      plan: null,
      trialDaysRemaining: null,
      referral: null,
      demo: false,
      readOnly: false,
      error: '',
      busy: false,
      referralCode: getInitialReferralCode(),
      resetToken: getInitialResetToken(),
      resetMessage: '',
      verificationToken: getInitialVerificationToken(),
      verificationMessage: '',
      emailVerificationAvailable: false,
      persona: 'bd',
      signupPersona: getInitialSignupPersona(),
    };

    function getInitialReferralCode() {
      const fromUrl = new URLSearchParams(window.location.search).get('ref') || '';
      const normalized = String(fromUrl || localStorage.getItem('bd_referral_code') || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 24);
      if (normalized) localStorage.setItem('bd_referral_code', normalized);
      return normalized;
    }

    function getInitialResetToken() {
      return String(new URLSearchParams(window.location.search).get('reset') || '').trim();
    }

    function getInitialVerificationToken() {
      return String(new URLSearchParams(window.location.search).get('verify') || '').trim();
    }

    function getInitialSignupPersona() {
      return new URLSearchParams(window.location.search).get('persona') === 'jobseeker' ? 'jobseeker' : 'bd';
    }

    // ── API helper ────────────────────────────────────────────────────────
    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        ...options,
      });
      const data = res.status === 204 ? null : await res.json();
      if (!res.ok) throw new Error(data?.error || `Request failed: ${res.status}`);
      return data;
    }

    function getVisitorId() {
      const key = 'bd_visitor_id';
      let visitorId = localStorage.getItem(key);
      if (!visitorId) {
        visitorId = crypto.randomUUID ? crypto.randomUUID() : `visitor-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(key, visitorId);
      }
      return visitorId;
    }

    async function trackPageVisit() {
      const params = new URLSearchParams(window.location.search);
      const source = params.get('utm_source') || (params.get('ref') ? 'referral' : (document.referrer ? 'referrer' : 'direct'));
      const payload = {
        visitorId: getVisitorId(),
        eventType: 'pageview',
        path: `${window.location.pathname}${window.location.hash || ''}`,
        referrer: document.referrer || '',
        source,
      };
      const body = JSON.stringify(payload);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/analytics/visit', new Blob([body], { type: 'application/json' }));
        return;
      }
      await fetch('/api/analytics/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body,
        keepalive: true,
      });
    }

    // ── Check auth status on load ─────────────────────────────────────────
    async function checkAuth() {
      cleanupServiceWorkers();
      trackPageVisit().catch(() => {});
      if (state.verificationToken) {
        try {
          const verification = await api('/api/auth/email-verification/confirm', {
            method: 'POST',
            body: JSON.stringify({ token: state.verificationToken }),
          });
          state.verificationMessage = verification.message || 'Email verified.';
        } catch (error) {
          state.verificationMessage = error.message || 'This verification link is invalid or expired.';
        } finally {
          state.verificationToken = '';
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('verify');
          window.history?.replaceState?.({}, document.title, `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
        }
      }
      try {
        const data = await api('/api/auth/me');
        if (data.authenticated) {
          state.user = data.user;
          state.tenant = data.tenant;
          state.tenants = data.tenants || [];
          state.plan = data.plan;
          state.trialDaysRemaining = data.trialDaysRemaining;
          state.referral = data.referral || null;
          state.demo = Boolean(data.demo);
          state.readOnly = Boolean(data.readOnly);
          state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
          state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
          state.view = 'app';
        } else if (state.resetToken) {
          state.view = 'reset';
        } else {
          state.view = 'landing';
        }
      } catch {
        state.view = state.resetToken ? 'reset' : 'landing';
      }
      render();
    }

    async function cleanupServiceWorkers() {
      if (!('serviceWorker' in navigator)) return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      } catch {
        // Service worker cleanup is best-effort only.
      }
    }

    // ── Auth actions ──────────────────────────────────────────────────────
    async function doLogin(email, password) {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = false;
        state.readOnly = false;
        state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
        state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
        state.view = 'app';
        state.error = '';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doSignup(email, password, name, workspaceName, persona) {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/auth/signup', {
          method: 'POST',
          body: JSON.stringify({ email, password, name, workspaceName, persona: persona || 'bd', referralCode: state.referralCode || '' }),
        });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = false;
        state.readOnly = false;
        state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
        state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
        if (data.verificationEmailSent) {
          state.verificationMessage = `A verification link was sent to ${data.user?.email || email}.`;
        }
        state.view = 'app';
        state.error = '';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doRequestPasswordReset(email) {
      state.busy = true;
      state.error = '';
      state.resetMessage = '';
      render();
      try {
        const data = await api('/api/auth/password-reset/request', {
          method: 'POST',
          body: JSON.stringify({ email }),
        });
        state.resetMessage = data.message || (data.emailConfigured
          ? 'If an account exists for that email, a reset link will be sent shortly.'
          : 'Password reset email is temporarily unavailable. Contact support@bdengine.io for account recovery.');
        if (data.resetToken) {
          state.resetToken = data.resetToken;
          state.view = 'reset';
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doConfirmPasswordReset(password) {
      state.busy = true;
      state.error = '';
      state.resetMessage = '';
      render();
      try {
        const data = await api('/api/auth/password-reset/confirm', {
          method: 'POST',
          body: JSON.stringify({ token: state.resetToken, password }),
        });
        state.resetMessage = data.message || 'Password reset. You can now log in.';
        state.resetToken = '';
        if (window.history?.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
        state.view = 'login';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doStartDemo() {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/demo/start', { method: 'POST', body: JSON.stringify({}) });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = true;
        state.readOnly = true;
        state.view = 'app';
        state.error = '';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doLogout() {
      try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
      state.user = null;
      state.tenant = null;
      state.plan = null;
      state.trialDaysRemaining = null;
      state.referral = null;
      state.demo = false;
      state.readOnly = false;
      state.emailVerificationAvailable = false;
      state.view = 'landing';
      state.error = '';
      render();
    }

    async function doRequestEmailVerification() {
      state.busy = true;
      state.verificationMessage = '';
      render();
      try {
        const data = await api('/api/auth/email-verification/request', {
          method: 'POST',
          body: JSON.stringify({}),
        });
        state.verificationMessage = data.message || 'Verification email sent.';
      } catch (error) {
        state.verificationMessage = error.message || 'Verification email could not be sent.';
      } finally {
        state.busy = false;
        render();
      }
    }

    async function exitDemoToSignup() {
      await doLogout();
      state.view = 'signup';
      state.error = '';
      render();
    }

    async function doExportData() {
      try {
        const response = await fetch('/api/privacy/export', { credentials: 'same-origin' });
        const data = await response.json();
        if (!response.ok) throw new Error(data?.error || `Export failed: ${response.status}`);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const slug = String(state.tenant?.slug || state.tenant?.name || 'workspace').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'workspace';
        link.href = url;
        link.download = `bd-engine-${slug}-export.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        state.error = err.message || 'Export failed.';
        render();
      }
    }

    const fallbackPlanLimits = {
      trial: { accounts: 25, contacts: 100, jobBoards: 50, users: 1, csvImports: 3 },
      jobseeker: { accounts: 200, contacts: 1000, jobBoards: 50, users: 1, csvImports: 50 },
      sales: { accounts: 1000, contacts: 10000, jobBoards: -1, users: 1, csvImports: -1 },
      owner: { accounts: -1, contacts: -1, jobBoards: -1, users: -1, csvImports: -1 },
    };

    function isTrialPlan() {
      const planId = state.plan?.id || state.tenant?.plan || 'trial';
      return planId === 'trial';
    }

    function getPlanLimits(planId = state.plan?.id || state.tenant?.plan || 'trial') {
      return state.plan?.limits || fallbackPlanLimits[planId] || fallbackPlanLimits.trial;
    }

    function formatLimit(value) {
      if (value === -1) return 'Unlimited';
      return new Intl.NumberFormat().format(Number(value || 0));
    }

    function formatCredit(cents) {
      const amount = Number(cents || 0) / 100;
      if (!amount) return 'billing credit';
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: amount % 1 ? 2 : 0 }).format(amount);
    }

    function getReferralLink() {
      return state.referral?.link || '';
    }

    function openBillingPage() {
      const frame = root.querySelector('.cloud-app-frame');
      if (!frame) return;
      // Navigate the SPA's hash in place rather than resetting src, which would
      // force a full ~373KB reload of the app on every billing click. The iframe
      // is same-origin, so hash navigation is allowed and the SPA's hashchange
      // router handles it without reloading.
      try {
        const win = frame.contentWindow;
        if (win && win.location && String(win.location.href).includes('/app/')) {
          win.location.hash = '#/admin/billing';
          return;
        }
      } catch { /* cross-origin/not-ready — fall through to full navigation */ }
      frame.src = '/app/#/admin/billing';
    }

    async function copyReferralLink(btn) {
      const link = getReferralLink();
      if (!link) {
        openBillingPage();
        return;
      }
      const original = btn?.textContent || 'Copy referral link';
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(link);
        } else {
          const input = document.createElement('input');
          input.value = link;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          input.remove();
        }
        if (btn) {
          btn.textContent = 'Copied';
          window.setTimeout(() => { btn.textContent = original; }, 1800);
        }
      } catch {
        openBillingPage();
      }
    }

    // ── Render ────────────────────────────────────────────────────────────
    function render() {
      switch (state.view) {
        case 'loading': return renderLoading();
        case 'landing': return renderLanding();
        case 'login': return renderLogin();
        case 'signup': return renderSignup();
        case 'forgot': return renderForgotPassword();
        case 'reset': return renderResetPassword();
        case 'app': return renderApp();
        case 'trust':
        case 'privacy':
        case 'terms':
        case 'security':
          return renderTrustSurface(state.view);
        case 'status': return renderStatusPage();
      }
    }

    function renderLoading() {
      root.innerHTML = `
        <div class="cloud-loading">
          <div class="cloud-spinner"></div>
          <p>Loading BD Engine Cloud...</p>
        </div>`;
    }

    // ── Landing page ──────────────────────────────────────────────────────
    function renderLanding() {
      root.innerHTML = `
        <div class="landing">
          <nav class="landing-nav">
            <div class="landing-nav-brand">
              <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="url(#bg)"/><path d="M7 8h6a5 5 0 010 10H7V8zm2 2v6h4a3 3 0 000-6H9z" fill="#fff"/><path d="M16 10h5a4 4 0 010 8h-5v-8zm2 2v4h3a2 2 0 000-4h-3z" fill="rgba(255,255,255,.7)"/><defs><linearGradient id="bg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg>
              </div>
              <span class="brand-text">BD Engine <span class="brand-cloud">Cloud</span></span>
            </div>
            <div class="landing-nav-actions">
              <button class="nav-link" data-trust-page="trust">Trust</button>
              <button class="nav-link" data-trust-page="status">Status</button>
              <button class="nav-link" id="nav-login">Log in</button>
              <button class="btn btn-primary btn-glow" id="nav-signup">Start free trial</button>
            </div>
          </nav>

          <section class="hero">
            <div class="hero-content">
              <div class="hero-badge">Cloud beta</div>
              <h1 class="hero-title">
                Business development<br>
                <span class="hero-gradient">for recruiting &amp; staffing</span>
              </h1>
              <p class="hero-subtitle">
                Turn your LinkedIn network into a ranked list of companies hiring right now — where you already know someone. Built for recruiters and staffing teams to win clients faster.
              </p>
              <div class="hero-cta">
                <button class="btn btn-primary btn-lg btn-glow" id="hero-signup">Start free trial</button>
                <button class="btn btn-ghost btn-lg" data-demo-start>${state.busy ? 'Opening demo...' : 'Try live demo'}</button>
              </div>
              <button class="link-btn hero-persona-link" data-jobseeker-signup>Looking for your next role? Start in Job Search mode.</button>
              <p class="hero-note">No credit card required · 14-day trial includes 25 accounts, 100 contacts, and 50 ATS boards</p>
            </div>
            <div class="hero-visual">
              <div class="hero-card hero-card-1">
                <div class="hero-card-header">
                  <span class="hero-card-dot green"></span>
                  <span>Pipeline Snapshot</span>
                </div>
                <div class="hero-card-body">
                  <div class="hero-stat"><span class="hero-stat-value">47</span><span class="hero-stat-label">Active accounts</span></div>
                  <div class="hero-stat"><span class="hero-stat-value">186</span><span class="hero-stat-label">Open roles tracked</span></div>
                  <div class="hero-stat"><span class="hero-stat-value">23</span><span class="hero-stat-label">Follow-ups due</span></div>
                </div>
              </div>
              <div class="hero-card hero-card-2">
                <div class="hero-card-header">
                  <span class="hero-card-dot blue"></span>
                  <span>Hiring Signal</span>
                </div>
                <div class="hero-card-body">
                  <p class="hero-signal-text"><strong>Northstar Robotics</strong> posted 6 new roles in the last 7 days</p>
                  <div class="hero-signal-bar"><div class="hero-signal-fill" style="width:84%"></div></div>
                  <p class="hero-signal-score">Target score: 91</p>
                </div>
              </div>
              <div class="hero-card hero-card-3">
                <div class="hero-card-header">
                  <span class="hero-card-dot purple"></span>
                  <span>Outreach Draft</span>
                </div>
                <div class="hero-card-body">
                  <p class="hero-draft-to">To: Priya Shah, Director of Talent</p>
                  <p class="hero-draft-preview">Hi Priya, I noticed Northstar is hiring across controls and embedded...</p>
                </div>
              </div>
            </div>
          </section>

          <section class="features" id="features">
            <h2 class="section-title">Everything you need to find and win the right accounts</h2>
            <div class="features-grid">
              <div class="feature-card">
                <div class="feature-icon" aria-hidden="true">PI</div>
                <h3>Pipeline Intelligence</h3>
                <p>See your entire pipeline at a glance. Target scores, hiring velocity, and relationship coverage are automatically ranked for focused weekly execution.</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon" aria-hidden="true">HS</div>
                <h3>Hiring Signals</h3>
                <p>Track public job activity across Greenhouse, Lever, Ashby, SmartRecruiters, Workday, BambooHR, Workable, Jobvite, and compatible career pages.</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon" aria-hidden="true">SO</div>
                <h3>Smart Outreach</h3>
                <p>Generate personalized email and LinkedIn drafts based on live hiring data, relationship context, and the account's current priorities.</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon" aria-hidden="true">NI</div>
                <h3>Network Intelligence</h3>
                <p>Import your LinkedIn connections and map relationship coverage across every target account to easily find warm referrals.</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon" aria-hidden="true">ATS</div>
                <h3>ATS Discovery</h3>
                <p>Automatically discover compatible public job boards, with manual URL entry and a review queue for sites that need help.</p>
              </div>

                <h3>Workflow Analytics</h3>
                <p>Track outreach velocity, pipeline coverage, follow-up queues, and data quality so the next action stays clear.</p>
              </div>
            </div>
          </section>

          <section class="referral-program" id="referrals">
            <div class="referral-copy">
              <span class="section-kicker">Referral program</span>
              <h2>Share BD Engine, earn billing credit.</h2>
              <p>Every workspace gets a referral link. Invite another founder, recruiter, or sales team and earn credit when they become a paid customer.</p>
            </div>
            <div class="referral-flow" aria-label="Referral program steps">
              <div class="referral-step">
                <span class="referral-step-number">1</span>
                <strong>Share your link</strong>
                <p>Use the referral link in Billing after you create a workspace.</p>
              </div>
              <div class="referral-step">
                <span class="referral-step-number">2</span>
                <strong>They upgrade</strong>
                <p>The referral is tracked through signup and subscription.</p>
              </div>
              <div class="referral-step">
                <span class="referral-step-number">3</span>
                <strong>You get credit</strong>
                <p>Credits are applied toward future BD Engine billing.</p>
              </div>
            </div>
          </section>

          <section class="pricing" id="pricing">
            <h2 class="section-title">Simple, transparent pricing</h2>
            <div class="pricing-grid">
              <div class="pricing-card">
                <div class="pricing-badge">Free trial</div>

                <ul class="pricing-features">
                  <li>25 accounts</li>
                  <li>100 contacts</li>

                  <li>Basic outreach drafts</li>

                </ul>
                <p class="pricing-upgrade">Upgrade when your readiness score shows enough live data to run the workflow every week.</p>
                <button class="btn btn-primary btn-block" data-signup>Start free trial</button>
              </div>
              <div class="pricing-card pricing-card--popular">
                <div class="pricing-badge popular">Complete workflow</div>
                <h3>Sales Professional</h3>
                <div class="pricing-price"><span class="price-amount">$10</span><span class="price-period">/month</span></div>
                <p class="pricing-fit">Best for sales, recruiting, and BD teams using live hiring signals to prioritize outreach.</p>
                <ul class="pricing-features">
                  <li>1,000 accounts</li>
                  <li>10,000 contacts</li>
                  <li>Unlimited ATS job boards</li>
                  <li>Enrichment + Outreach Drafts</li>
                  <li>CSV export</li>
                  <li>Workspace sync across your devices</li>
                </ul>
                <p class="pricing-upgrade">Workspace notes, sequences, custom fields, activity, and automation rules follow your signed-in account across devices. Personal display preferences stay on each device.</p>
                <button class="btn btn-primary btn-block btn-glow" data-signup>Get started</button>
              </div>
              <div class="pricing-card">
                <div class="pricing-badge">For job seekers</div>
                <h3>Job Seeker</h3>
                <div class="pricing-price"><span class="price-amount">$5</span><span class="price-period">/month</span></div>
                <p class="pricing-fit">Best for prioritizing target companies, open roles, and warm contacts during an active search.</p>
                <ul class="pricing-features">
                  <li>200 target companies</li>

                  <div class="cloud-user-info">
                    <strong>${escapeHtml(state.user?.name || '')}</strong>
                    <span>${escapeHtml(state.user?.email || '')}</span>
                    ${state.demo ? '' : `<span class="cloud-verification-status ${emailVerified ? 'is-verified' : ''}">${emailVerified ? 'Email verified' : 'Email not verified'}</span>`}
                  </div>
                  <hr>
                  ${state.demo ? '' : '<button class="cloud-menu-item" id="cloud-billing-btn" type="button" role="menuitem">Billing and plan</button>'}
                  ${!state.demo && state.emailVerificationAvailable && !emailVerified ? '<button class="cloud-menu-item" id="cloud-verify-email-btn" type="button" role="menuitem">Send verification email</button>' : ''}
                  <button class="cloud-menu-item" id="cloud-export-btn" type="button" role="menuitem">Export my data</button>
                  <a class="cloud-menu-item" href="mailto:support@bdengine.io?subject=BD%20Engine%20support" role="menuitem">Contact support</a>
                  ${state.demo ? '<button class="cloud-menu-item" id="cloud-demo-signup-menu-btn" type="button" role="menuitem">Start free trial</button>' : '<button class="cloud-menu-item" id="cloud-referral-menu-btn" type="button" role="menuitem">Referral program</button>'}
                  <button class="cloud-menu-item" id="cloud-logout-btn" type="button" role="menuitem">Log out</button>
                </div>
              </div>
            </div>
          </div>
          ${trialUpgradeBanner}
          ${verificationNotice}
          <div class="cloud-app-container">
            <iframe class="cloud-app-frame" title="BD Engine workspace" src="/app/#/dashboard"></iframe>
          </div>
        </div>`;

      // Wire user menu
      const avatarBtn = root.querySelector('#cloud-avatar-btn');
      const dropdown = root.querySelector('#cloud-user-dropdown');
      const setUserMenuOpen = (open) => {
        dropdown?.classList.toggle('hidden', !open);
        avatarBtn?.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      avatarBtn?.addEventListener('click', () => setUserMenuOpen(dropdown?.classList.contains('hidden')));
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#cloud-user-menu')) setUserMenuOpen(false);
      });
      root.querySelector('#cloud-logout-btn')?.addEventListener('click', doLogout);
      root.querySelector('#cloud-export-btn')?.addEventListener('click', () => {
        doExportData();
        setUserMenuOpen(false);
      });
      root.querySelector('#cloud-verify-email-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        doRequestEmailVerification();
      });
      root.querySelector('#cloud-notice-close')?.addEventListener('click', () => {
        state.verificationMessage = '';
        render();
      });
      root.querySelector('[data-demo-signup]')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-demo-signup-menu-btn')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-billing-btn')?.addEventListener('click', () => {
        openBillingPage();
        setUserMenuOpen(false);
      });
      root.querySelector('#cloud-upgrade-btn')?.addEventListener('click', openBillingPage);
      root.querySelector('#cloud-referral-btn')?.addEventListener('click', (event) => copyReferralLink(event.currentTarget));
      root.querySelector('#cloud-referral-menu-btn')?.addEventListener('click', (event) => {
        copyReferralLink(event.currentTarget);
        setUserMenuOpen(false);
      });
    }

    // ── Utility ───────────────────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    // ── Init ──────────────────────────────────────────────────────────────
    render();
    checkAuth();
  })();
  </script>
</body>
</html>
