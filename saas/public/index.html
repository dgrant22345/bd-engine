<body>
  <div id="cloud-root"></div>

  <script>
  (() => {
    const root = document.getElementById('cloud-root');

    // ── State ─────────────────────────────────────────────────────────────
    let state = {
      view: 'loading', // loading | landing | login | signup | forgot | reset | app | trust | privacy | terms | security | status
      user: null,
      tenant: null,
      tenants: [],
      plan: null,
      trialDaysRemaining: null,
      referral: null,
      demo: false,
      readOnly: false,
      error: '',
      busy: false,
      referralCode: getInitialReferralCode(),
      resetToken: getInitialResetToken(),
      resetMessage: '',
      verificationToken: getInitialVerificationToken(),
      verificationMessage: '',
      accountClosedMessage: '',
      emailVerificationAvailable: false,
      canManageSupport: false,
      canManageWorkspace: false,
      persona: 'bd',
      signupPersona: getInitialSignupPersona(),
      acquisition: getInitialAcquisition(),
    };

    function getInitialReferralCode() {
      const fromUrl = new URLSearchParams(window.location.search).get('ref') || '';
      const normalized = String(fromUrl || localStorage.getItem('bd_referral_code') || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 24);
      if (normalized) localStorage.setItem('bd_referral_code', normalized);
      return normalized;
    }

    function getInitialResetToken() {
      return String(new URLSearchParams(window.location.search).get('reset') || '').trim();
    }

    function getInitialVerificationToken() {
      return String(new URLSearchParams(window.location.search).get('verify') || '').trim();
    }

    function getInitialSignupPersona() {
      const requestedPersona = new URLSearchParams(window.location.search).get('persona');
      return window.location.pathname === '/job-search' || requestedPersona === 'jobseeker' ? 'jobseeker' : 'bd';
    }

    function getInitialAcquisition() {
      const params = new URLSearchParams(window.location.search);
      const current = {
        source: normalizeAcquisitionToken(params.get('utm_source')),
        medium: normalizeAcquisitionToken(params.get('utm_medium')),
        campaign: normalizeAcquisitionToken(params.get('utm_campaign')),
      };
      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem('bd_acquisition') || '{}');
      } catch {}
      const acquisition = current.source || current.campaign
        ? current
        : {
            source: normalizeAcquisitionToken(stored.source),
            medium: normalizeAcquisitionToken(stored.medium),
            campaign: normalizeAcquisitionToken(stored.campaign),
          };
      if (!acquisition.source) {
        acquisition.source = params.get('ref') ? 'referral' : (document.referrer ? 'referrer' : 'direct');
      }
      try { localStorage.setItem('bd_acquisition', JSON.stringify(acquisition)); } catch {}
      return acquisition;
    }

    function normalizeAcquisitionToken(value) {
      const raw = String(value || '').trim();
      if (raw.includes('@')) return '';
      return raw
        .toLowerCase()
        .replace(/[^a-z0-9_.-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^[.-]+|[.-]+$/g, '')
        .slice(0, 32);
    }

    function getAcquisitionSource() {
      const source = normalizeAcquisitionToken(state.acquisition?.source) || 'direct';
      const campaign = normalizeAcquisitionToken(state.acquisition?.campaign);
      return (campaign && campaign !== source ? `${source}.${campaign}` : source).slice(0, 48);
    }

    // ── API helper ────────────────────────────────────────────────────────
    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        ...options,
      });
      const data = res.status === 204 ? null : await res.json();
      if (!res.ok) {
        const error = new Error(data?.error || `Request failed: ${res.status}`);
        error.code = data?.code || '';
        error.status = res.status;
        error.details = data;
        throw error;
      }
      return data;
    }

    function getVisitorId() {
      const key = 'bd_visitor_id';
      let visitorId = localStorage.getItem(key);
      if (!visitorId) {
        visitorId = crypto.randomUUID ? crypto.randomUUID() : `visitor-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(key, visitorId);
      }
      return visitorId;
    }

    async function trackAcquisitionEvent(eventType = 'pageview') {
      const payload = {
        visitorId: getVisitorId(),
        eventType,
        path: `${window.location.pathname}${window.location.hash || ''}`,
        referrer: document.referrer || '',
        source: getAcquisitionSource(),
      };
      const body = JSON.stringify(payload);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/analytics/visit', new Blob([body], { type: 'application/json' }));
        return;
      }
      await fetch('/api/analytics/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body,
        keepalive: true,
      });
    }

    async function trackPageVisit() {
      return trackAcquisitionEvent('pageview');
    }

    // ── Check auth status on load ─────────────────────────────────────────
    async function checkAuth() {
      cleanupServiceWorkers();
      trackPageVisit().catch(() => {});
      if (state.verificationToken) {
        try {
          const verification = await api('/api/auth/email-verification/confirm', {
            method: 'POST',
            body: JSON.stringify({ token: state.verificationToken }),
          });
          state.verificationMessage = verification.message || 'Email verified.';
        } catch (error) {
          state.verificationMessage = error.message || 'This verification link is invalid or expired.';
        } finally {
          state.verificationToken = '';
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('verify');
          window.history?.replaceState?.({}, document.title, `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
        }
      }
      try {
        const data = await api('/api/auth/me');
        if (data.authenticated) {
          state.user = data.user;
          state.tenant = data.tenant;
          state.tenants = data.tenants || [];
          state.plan = data.plan;
          state.trialDaysRemaining = data.trialDaysRemaining;
          state.referral = data.referral || null;
          state.demo = Boolean(data.demo);
          state.readOnly = Boolean(data.readOnly);
          state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
          state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
          state.canManageSupport = Boolean(data.canManageSupport);
          state.canManageWorkspace = Boolean(data.canManageWorkspace);
          const mismatchedJobSeekerDemo = state.demo
            && state.signupPersona === 'jobseeker'
            && state.persona !== 'jobseeker';
          if (mismatchedJobSeekerDemo) {
            await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
            state.user = null;
            state.tenant = null;
            state.tenants = [];
            state.plan = null;
            state.trialDaysRemaining = null;
            state.referral = null;
            state.demo = false;
            state.readOnly = false;
            state.emailVerificationAvailable = false;
            state.canManageSupport = false;
            state.canManageWorkspace = false;
            state.persona = 'jobseeker';
            state.view = 'landing';
          } else {
            state.view = 'app';
          }
        } else if (state.resetToken) {
          state.view = 'reset';
        } else {
          state.view = new URLSearchParams(window.location.search).get('login') === '1' ? 'login' : 'landing';
        }
      } catch {
        state.view = state.resetToken
          ? 'reset'
          : (new URLSearchParams(window.location.search).get('login') === '1' ? 'login' : 'landing');
      }
      render();
    }

    async function cleanupServiceWorkers() {
      if (!('serviceWorker' in navigator)) return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      } catch {
        // Service worker cleanup is best-effort only.
      }
    }

    // ── Auth actions ──────────────────────────────────────────────────────
    async function doLogin(email, password) {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = false;
        state.readOnly = false;
        state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
        state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
        state.canManageSupport = Boolean(data.canManageSupport);
        state.canManageWorkspace = Boolean(data.canManageWorkspace);
        state.view = 'app';
        state.error = '';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    function openSignup(persona = state.signupPersona) {
      state.signupPersona = persona === 'jobseeker' ? 'jobseeker' : 'bd';
      trackAcquisitionEvent('signup_started').catch(() => {});
      state.view = 'signup';
      render();
    }

    async function doSignup(email, password, name, workspaceName, persona) {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/auth/signup', {
          method: 'POST',
          body: JSON.stringify({
            email,
            password,
            name,
            workspaceName,
            persona: persona || 'bd',
            referralCode: state.referralCode || '',
            acquisition: state.acquisition,
          }),
        });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = false;
        state.readOnly = false;
        state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
        state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
        state.canManageSupport = Boolean(data.canManageSupport);
        state.canManageWorkspace = Boolean(data.canManageWorkspace);
        if (data.verificationEmailSent) {
          state.verificationMessage = `A verification link was sent to ${data.user?.email || email}.`;
        }
        state.view = 'app';
        state.error = '';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doRequestPasswordReset(email) {
      state.busy = true;
      state.error = '';
      state.resetMessage = '';
      render();
      try {
        const data = await api('/api/auth/password-reset/request', {
          method: 'POST',
          body: JSON.stringify({ email }),
        });
        state.resetMessage = data.message || (data.emailConfigured
          ? 'If an account exists for that email, a reset link will be sent shortly.'
          : 'Password reset email is temporarily unavailable. Contact dgfinance15@gmail.com for account recovery.');
        if (data.resetToken) {
          state.resetToken = data.resetToken;
          state.view = 'reset';
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doConfirmPasswordReset(password) {
      state.busy = true;
      state.error = '';
      state.resetMessage = '';
      render();
      try {
        const data = await api('/api/auth/password-reset/confirm', {
          method: 'POST',
          body: JSON.stringify({ token: state.resetToken, password }),
        });
        state.resetMessage = data.message || 'Password reset. You can now log in.';
        state.resetToken = '';
        if (window.history?.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
        state.view = 'login';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doStartDemo() {
      state.busy = true;
      state.error = '';
      render();
      try {
        const data = await api('/api/demo/start', { method: 'POST', body: JSON.stringify({}) });
        state.user = data.user;
        state.tenant = data.tenant;
        state.tenants = data.tenants || [];
        state.plan = data.plan || null;
        state.trialDaysRemaining = data.trialDaysRemaining ?? null;
        state.referral = data.referral || null;
        state.demo = true;
        state.readOnly = true;
        state.canManageSupport = false;
        state.canManageWorkspace = false;
        state.view = 'app';
        state.error = '';
        trackAcquisitionEvent('demo_started').catch(() => {});
      } catch (err) {
        state.error = err.message;
      } finally {
        state.busy = false;
        render();
      }
    }

    async function doLogout() {
      try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
      state.user = null;
      state.tenant = null;
      state.plan = null;
      state.trialDaysRemaining = null;
      state.referral = null;
      state.demo = false;
      state.readOnly = false;
      state.emailVerificationAvailable = false;
      state.canManageSupport = false;
      state.canManageWorkspace = false;
      state.view = 'landing';
      state.error = '';
      render();
    }

    async function doRequestEmailVerification() {
      state.busy = true;
      state.verificationMessage = '';
      render();
      try {
        const data = await api('/api/auth/email-verification/request', {
          method: 'POST',
          body: JSON.stringify({}),
        });
        state.verificationMessage = data.message || 'Verification email sent.';
      } catch (error) {
        state.verificationMessage = error.message || 'Verification email could not be sent.';
      } finally {
        state.busy = false;
        render();
      }
    }

    async function exitDemoToSignup() {
      await doLogout();
      state.error = '';
      openSignup();
    }

    async function doExportData() {
      try {
        const response = await fetch('/api/privacy/export', { credentials: 'same-origin' });
        const data = await response.json();
        if (!response.ok) throw new Error(data?.error || `Export failed: ${response.status}`);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const slug = String(state.tenant?.slug || state.tenant?.name || 'workspace').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'workspace';
        link.href = url;
        link.download = `bd-engine-${slug}-export.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        state.error = err.message || 'Export failed.';
        render();
      }
    }

    const fallbackPlanLimits = {
      trial: { accounts: 25, contacts: 100, jobBoards: 50, users: 1, csvImports: 3 },
      jobseeker: { accounts: 200, contacts: 1000, jobBoards: 50, users: 1, csvImports: 50 },
      sales: { accounts: 1000, contacts: 10000, jobBoards: -1, users: 1, csvImports: -1 },
      owner: { accounts: -1, contacts: -1, jobBoards: -1, users: -1, csvImports: -1 },
    };

    function isTrialPlan() {
      const planId = state.plan?.id || state.tenant?.plan || 'trial';
      return planId === 'trial';
    }

    function getPlanLimits(planId = state.plan?.id || state.tenant?.plan || 'trial') {
      return state.plan?.limits || fallbackPlanLimits[planId] || fallbackPlanLimits.trial;
    }

    function formatLimit(value) {
      if (value === -1) return 'Unlimited';
      return new Intl.NumberFormat().format(Number(value || 0));
    }

    function formatCredit(cents) {
      const amount = Number(cents || 0) / 100;
      if (!amount) return 'billing credit';
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: amount % 1 ? 2 : 0 }).format(amount);
    }

    function getReferralLink() {
      return state.referral?.link || '';
    }

    function openBillingPage() {
      const frame = root.querySelector('.cloud-app-frame');
      if (!frame) return;
      // Navigate the SPA's hash in place rather than resetting src, which would
      // force a full ~373KB reload of the app on every billing click. The iframe
      // is same-origin, so hash navigation is allowed and the SPA's hashchange
      // router handles it without reloading.
      try {
        const win = frame.contentWindow;
        if (win && win.location && String(win.location.href).includes('/app/')) {
          win.location.hash = '#/admin/billing';
          return;
        }
      } catch { /* cross-origin/not-ready — fall through to full navigation */ }
      frame.src = '/app/#/admin/billing';
    }

    async function copyReferralLink(btn) {
      const link = getReferralLink();
      if (!link) {
        openBillingPage();
        return;
      }
      const original = btn?.textContent || 'Copy referral link';
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(link);
        } else {
          const input = document.createElement('input');
          input.value = link;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          input.remove();
        }
        if (btn) {
          btn.textContent = 'Copied';
          window.setTimeout(() => { btn.textContent = original; }, 1800);
        }
      } catch {
        openBillingPage();
      }
    }

    // ── Render ────────────────────────────────────────────────────────────
    function render() {
      switch (state.view) {
        case 'loading': return renderLoading();
        case 'landing': return renderLanding();
        case 'login': return renderLogin();
        case 'signup': return renderSignup();
        case 'forgot': return renderForgotPassword();
        case 'reset': return renderResetPassword();
        case 'app': return renderApp();
        case 'trust':
        case 'privacy':
        case 'terms':
        case 'security':
          return renderTrustSurface(state.view);
        case 'status': return renderStatusPage();
      }
    }

    function renderLoading() {
      root.innerHTML = `
        <div class="cloud-loading">
          <div class="cloud-spinner"></div>
          <p>Loading BD Engine Cloud...</p>
        </div>`;
    }

    // ── Landing page ──────────────────────────────────────────────────────
    function renderLanding() {
      const landingStartedAt = performance.now();
      const isJobSeekerLanding = state.signupPersona === 'jobseeker';
      const landingCopy = isJobSeekerLanding ? {
        badge: 'A focused job-search workspace',
        title: 'Know which employers are worth your next move.',
        subtitle: 'Rank target companies and public roles by your role, location, and keyword focus. Add your network to see where a useful path may already exist.',
        primaryCta: 'Start job search',
        sectionTitle: 'From a broad search to one useful next action',
        sectionIntro: 'BD Engine keeps the market, your network, and your follow-up work in one explainable daily view.',
        footer: 'Built for focused staffing business development and job searches.',
        referralTitle: 'Share a focused search, earn billing credit.',
        referralBody: 'Every workspace gets a referral link. Share BD Engine with another job seeker, recruiter, or founder and earn credit when they become a paid customer.',
        previewLabel: 'Best next move',
        previewReason: 'Three relevant roles and a mapped talent contact make this the clearest company to work next.',
        previewScore: '91',
        previewStats: [['3', 'Relevant roles'], ['1', 'Network path'], ['2d', 'Freshest role']],
        nextAction: 'Review the controls role, then prepare a warm introduction through Priya.',
        workflowSteps: [
          ['Set your focus', 'Choose target roles, locations, and keywords so every result has a clear reason to appear.'],
          ['Check the market', 'Connect target employers to compatible public career sites and current roles.'],
          ['Work the best path', 'Bring the strongest role, company context, and network contact into one next-action queue.'],
        ],
      } : {
        badge: 'A hiring-signal workspace for staffing teams',
        title: 'Know which staffing accounts are worth your next call.',
        subtitle: 'Rank target companies using current public hiring activity and the relationships you import, then turn the strongest signal into a clear next action.',
        primaryCta: 'Start free trial',
        sectionTitle: 'From a target list to one useful next action',
        sectionIntro: 'BD Engine joins hiring demand, relationship context, and follow-up work without hiding how the priority was chosen.',
        footer: 'Built for staffing and recruiting teams.',
        referralTitle: 'Share BD Engine, earn billing credit.',
        referralBody: 'Every workspace gets a referral link. Invite another founder, recruiter, or sales team and earn credit when they become a paid customer.',
        previewLabel: 'Best account today',
        previewReason: 'Fresh controls hiring plus a mapped talent leader makes this the clearest account to work next.',
        previewScore: '91',
        previewStats: [['2', 'Active roles'], ['84', 'Hiring velocity'], ['1', 'Warm contact']],
        nextAction: 'Follow up with Priya Shah using the two active controls roles as timely context.',
        workflowSteps: [
          ['Bring your target universe', 'Import companies and the contacts you already have instead of starting with another opaque database.'],
          ['Resolve hiring demand', 'Connect accounts to compatible public ATS boards and send uncertain sites to a review queue.'],
          ['Work the ranked list', 'See the score explanation, strongest contact, and recommended next move before you reach out.'],
        ],
      };
      root.innerHTML = `
        <div class="landing">
          <a class="skip-link" href="#main-content">Skip to main content</a>
          <nav class="landing-nav">
            <div class="landing-nav-inner">
              <a class="landing-nav-brand" href="/" aria-label="BD Engine home">
                <img src="/bd-engine-logo.png" width="30" height="30" alt="">
                <span class="brand-text">BD Engine</span>
              </a>

    const supportStatusLabels = {
      new: 'New',
      open: 'In progress',
      waiting_on_customer: 'Waiting for you',
      resolved: 'Resolved',
      closed: 'Closed',
    };

    const supportCategoryLabels = {
      job_discovery: 'Job and ATS discovery',
      data_import: 'Import or data issue',
      outreach: 'Outreach drafts',
      billing: 'Billing or subscription',
      account: 'Account access',
      feedback: 'Product feedback',
      other: 'Something else',
    };

    function formatSupportDate(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function supportMessagesHtml(messages = []) {
      return messages.map((message) => `
        <div class="support-message ${message.authorType === 'support' ? 'is-support' : ''} ${message.internal ? 'is-internal' : ''}">
          <div class="support-message-meta">
            <strong>${message.internal ? 'Internal note' : (message.authorType === 'support' ? 'BD Engine support' : 'You')}</strong>
            <span>${escapeHtml(formatSupportDate(message.createdAt))}</span>
          </div>
          <p>${escapeHtml(message.body).replace(/\n/g, '<br>')}</p>
        </div>`).join('');
    }

    function supportTicketHtml(ticket, { operator = false, open = false } = {}) {
      const status = supportStatusLabels[ticket.status] || ticket.status || 'New';
      const category = supportCategoryLabels[ticket.category] || 'Support request';
      const requester = operator
        ? `<span>${escapeHtml(ticket.requester?.email || ticket.createdByUserId || 'Unknown requester')} · ${escapeHtml(ticket.workspaceName || ticket.tenantId || '')}</span>`
        : `<span>${escapeHtml(category)} · Updated ${escapeHtml(formatSupportDate(ticket.updatedAt))}</span>`;
      const operatorControls = operator ? `
        <div class="support-triage-controls">
          <label>Status
            <select data-ticket-status>
              ${Object.entries(supportStatusLabels).map(([value, label]) => `<option value="${value}" ${ticket.status === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </label>
          <label>Priority
            <select data-ticket-priority>
              ${['low', 'normal', 'high', 'urgent'].map((value) => `<option value="${value}" ${ticket.priority === value ? 'selected' : ''}>${value.charAt(0).toUpperCase() + value.slice(1)}</option>`).join('')}
            </select>
          </label>
          <button class="btn btn-secondary btn-sm" type="button" data-support-save="${escapeHtml(ticket.id)}">Save</button>
        </div>` : '';
      const replyControls = operator ? `
        <form class="support-reply-form" data-support-operator-reply="${escapeHtml(ticket.id)}">
          <label for="operator-reply-${escapeHtml(ticket.id)}">Reply or internal note</label>
          <textarea id="operator-reply-${escapeHtml(ticket.id)}" name="body" rows="3" maxlength="5000" placeholder="Write a clear next step..." required></textarea>
          <div class="support-form-actions">
            <label class="support-check"><input type="checkbox" name="internal"> Internal note</label>
            <button class="btn btn-primary btn-sm" type="submit">Send</button>
          </div>
        </form>` : `
        ${['resolved', 'closed'].includes(ticket.status) ? '<p class="support-resolution-note">Need more help? Replying will reopen this request.</p>' : ''}
        <form class="support-reply-form" data-support-reply="${escapeHtml(ticket.id)}">
          <label for="support-reply-${escapeHtml(ticket.id)}">Add a reply</label>
          <textarea id="support-reply-${escapeHtml(ticket.id)}" name="body" rows="3" maxlength="5000" placeholder="Add any details that may help..." required></textarea>
          <div class="support-form-actions"><button class="btn btn-primary btn-sm" type="submit">Send reply</button></div>
        </form>`;
      return `
        <details class="support-ticket" data-support-ticket="${escapeHtml(ticket.id)}" ${open ? 'open' : ''}>
          <summary>
            <span class="support-ticket-title"><strong>${escapeHtml(ticket.subject)}</strong>${requester}</span>
            <span class="support-status status-${escapeHtml(ticket.status)}">${escapeHtml(status)}</span>
          </summary>
          <div class="support-ticket-detail">
            ${operatorControls}
            <div class="support-conversation">${supportMessagesHtml(ticket.messages)}</div>
            ${replyControls}
          </div>
        </details>`;
    }

    function openSupportCenter({ operator = false } = {}) {
      root.querySelector('.support-backdrop')?.remove();
      root.insertAdjacentHTML('beforeend', `
        <div class="support-backdrop" data-support-close-backdrop>
          <section class="support-modal" role="dialog" aria-modal="true" aria-labelledby="support-title">
            <header class="support-modal-header">
              <div><span class="support-eyebrow">Help and support</span><h2 id="support-title">Support center</h2></div>
              <button class="support-close" type="button" data-support-close aria-label="Close support center">Close</button>
            </header>
            ${state.canManageSupport ? `<nav class="support-tabs" aria-label="Support views">
              <button type="button" data-support-tab="customer" class="${operator ? '' : 'is-active'}">My requests</button>
              <button type="button" data-support-tab="operator" class="${operator ? 'is-active' : ''}">Support inbox</button>
            </nav>` : ''}

          </section>

      const backdrop = root.querySelector('.support-backdrop');
      const onKeydown = (event) => { if (event.key === 'Escape') close(); };
      const close = () => {
        document.removeEventListener('keydown', onKeydown);
        backdrop?.remove();
      };
      backdrop.querySelector('[data-support-close]')?.addEventListener('click', close);
      backdrop.addEventListener('click', (event) => { if (event.target === backdrop) close(); });
      document.addEventListener('keydown', onKeydown);
      backdrop.querySelector('[data-support-close]')?.focus();
      backdrop.querySelector('[data-support-tab="customer"]')?.addEventListener('click', () => loadCustomerSupport(backdrop));
      backdrop.querySelector('[data-support-tab="operator"]')?.addEventListener('click', () => loadOperatorSupport(backdrop));
      if (operator && state.canManageSupport) loadOperatorSupport(backdrop);
      else loadCustomerSupport(backdrop);
    }

    function setSupportTab(backdrop, tab) {
      backdrop.querySelectorAll('[data-support-tab]').forEach((button) => button.classList.toggle('is-active', button.dataset.supportTab === tab));
    }

    async function loadCustomerSupport(backdrop, notice = '') {
      setSupportTab(backdrop, 'customer');
      const body = backdrop.querySelector('[data-support-body]');
      body.innerHTML = '<div class="support-loading"><span class="btn-spinner"></span> Loading your requests...</div>';
      try {
        const data = await api('/api/support/tickets');
        const tickets = data.tickets || [];
        body.innerHTML = `
          ${notice ? `<div class="support-notice" role="status">${escapeHtml(notice)}</div>` : ''}
          <div class="support-customer-layout">
            <form class="support-compose" data-support-create>
              <div><h3>How can we help?</h3><p>Share what you expected and what happened. We will keep the conversation here.</p></div>
              <label for="support-category">Topic</label>
              <select id="support-category" name="category">${Object.entries(supportCategoryLabels).map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`).join('')}</select>
              <label for="support-subject">Subject</label>
              <input id="support-subject" name="subject" maxlength="120" placeholder="A short summary" required>
              <label for="support-description">Details</label>
              <textarea id="support-description" name="body" rows="7" maxlength="5000" placeholder="What were you trying to do? What did you see instead?" required></textarea>
              <div class="support-form-actions"><button class="btn btn-primary" type="submit">Send request</button></div>
              <p class="support-email-fallback">Cannot use this form? <a href="mailto:dgfinance15@gmail.com?subject=BD%20Engine%20support">Email dgfinance15@gmail.com</a>.</p>
            </form>
            <section class="support-history" aria-labelledby="support-history-title">
              <div class="support-section-heading"><div><h3 id="support-history-title">Your requests</h3><p>${tickets.length ? `${tickets.length} recent request${tickets.length === 1 ? '' : 's'}` : 'Updates and replies will appear here.'}</p></div></div>
              ${tickets.length ? tickets.map((ticket, index) => supportTicketHtml(ticket, { open: index === 0 })).join('') : `
                <div class="support-empty"><strong>No support requests yet</strong><p>Use the form when you hit a blocker, have a billing question, or want to share feedback.</p></div>`}
            </section>
          </div>`;
        wireCustomerSupportForms(backdrop);
      } catch (error) {
        body.innerHTML = `<div class="support-error" role="alert"><strong>Support requests could not load.</strong><p>${escapeHtml(error.message)}</p><a href="mailto:dgfinance15@gmail.com?subject=BD%20Engine%20support">Email support instead</a></div>`;
      }
    }

    function openPrivacyCenter() {
      root.querySelector('.support-backdrop')?.remove();
      const expected = `DELETE ${state.tenant?.name || 'Workspace'}`;
      const deletionPanel = state.canManageWorkspace ? `
        <form class="support-compose" data-privacy-delete>
          <div><h3>Delete workspace data</h3><p>Permanently removes accounts, contacts, jobs, boards, tasks, and activity. Your login and empty workspace remain available.</p></div>
          <label for="privacy-delete-password">Current password</label>
          <input id="privacy-delete-password" name="password" type="password" autocomplete="current-password" required>
          <label for="privacy-confirm">Type <strong>${escapeHtml(expected)}</strong> to confirm</label>
          <input id="privacy-confirm" name="confirm" autocomplete="off" required>
          <div class="support-form-actions"><button class="btn btn-danger" type="submit" disabled>Delete workspace data</button></div>
          <div data-privacy-result aria-live="polite"></div>
        </form>` : `
        <section class="support-compose">
          <div><h3>Delete workspace data</h3><p>Only the workspace owner can permanently delete shared workspace data.</p></div>
          <div class="support-form-actions"><button class="btn btn-ghost" type="button" data-privacy-support>Contact support</button></div>
        </section>`;

      root.insertAdjacentHTML('beforeend', `
        <div class="support-backdrop" data-privacy-backdrop>
          <section class="support-modal" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
            <header class="support-modal-header">
              <div><span class="support-eyebrow">Account controls</span><h2 id="privacy-title">Privacy and data</h2></div>
              <button class="support-close" type="button" data-privacy-close aria-label="Close privacy and data">Close</button>
            </header>
            <div class="support-modal-body">
              <div class="support-customer-layout">
                <section class="support-compose">
                  <div><h3>Export workspace data</h3><p>Download a JSON copy of your profile, accounts, contacts, jobs, boards, tasks, and activity.</p></div>
                  <div class="support-form-actions"><button class="btn btn-primary" type="button" data-privacy-export>Download export</button></div>
                  <p class="support-email-fallback">Need the account closed as well? Send an account request through the support center.</p>
                </section>
                ${deletionPanel}
              </div>
              <section class="account-closure-panel" data-account-closure aria-live="polite">
                <div class="support-loading"><span class="btn-spinner"></span> Checking account closure requirements...</div>
              </section>
            </div>
          </section>
        </div>`);

      const backdrop = root.querySelector('[data-privacy-backdrop]');
      const onKeydown = (event) => { if (event.key === 'Escape') close(); };
      const close = () => {
        document.removeEventListener('keydown', onKeydown);
        backdrop?.remove();
      };
      backdrop.querySelector('[data-privacy-close]')?.addEventListener('click', close);
      backdrop.addEventListener('click', (event) => { if (event.target === backdrop) close(); });
      document.addEventListener('keydown', onKeydown);
      backdrop.querySelector('[data-privacy-close]')?.focus();
      backdrop.querySelector('[data-privacy-export]')?.addEventListener('click', () => {
        doExportData();
      });
      backdrop.querySelector('[data-privacy-support]')?.addEventListener('click', () => {
        close();
        openSupportCenter();
      });

      const form = backdrop.querySelector('[data-privacy-delete]');
      const input = form?.elements.confirm;
      const passwordInput = form?.elements.password;
      const submit = form?.querySelector('button[type="submit"]');
      const syncDeleteSubmit = () => {
        submit.disabled = input.value.trim() !== expected || !passwordInput.value;
      };
      input?.addEventListener('input', syncDeleteSubmit);
      passwordInput?.addEventListener('input', syncDeleteSubmit);
      form?.addEventListener('submit', async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = 'Deleting...';
        try {
          const data = await api('/api/privacy/delete-workspace', {
            method: 'POST',
            body: JSON.stringify({ confirm: input.value.trim(), password: passwordInput.value }),
          });
          close();
          state.verificationMessage = data.message || 'Workspace data deleted.';
          render();
        } catch (error) {
          submit.textContent = 'Delete workspace data';
          syncDeleteSubmit();
          form.querySelector('[data-privacy-result]').innerHTML = `<div class="support-error" role="alert"><strong>Data was not deleted.</strong><p>${escapeHtml(error.message)}</p></div>`;
        }
      });
      loadAccountClosure(backdrop);
    }

    async function loadAccountClosure(backdrop) {
      const panel = backdrop.querySelector('[data-account-closure]');
      if (!panel) return;
      try {
        const data = await api('/api/privacy/account-closure');
        if (!data.eligible) {
          panel.innerHTML = `
            <div><h3>Close account</h3><p>Your account cannot be closed automatically because doing so would leave a shared workspace without an owner.</p></div>
            <div class="support-error" role="status"><strong>Ownership transfer required</strong><ul>${(data.blockers || []).map((item) => `<li>${escapeHtml(item.message)}</li>`).join('')}</ul></div>
            <div class="support-form-actions"><button class="btn btn-ghost" type="button" data-closure-support>Contact support</button></div>`;
          panel.querySelector('[data-closure-support]')?.addEventListener('click', () => {
            backdrop.remove();
            openSupportCenter();
          });
          return;
        }

        const consequences = [
          ...(data.deleteWorkspaces || []).map((item) => `Delete workspace: ${item.name}`),
          ...(data.leaveWorkspaces || []).map((item) => `Leave workspace: ${item.name}`),
          ...(data.subscriptionsToCancel ? [`Cancel ${data.subscriptionsToCancel} active subscription${data.subscriptionsToCancel === 1 ? '' : 's'}`] : []),
        ];
        panel.innerHTML = `
          <form class="support-compose account-closure-form" data-account-closure-form>
            <div><h3>Close account</h3><p>Permanently removes your login and personal identifiers. Sole-user workspaces are deleted, shared workspaces with another owner remain available, and attached subscriptions are canceled first.</p></div>
            ${consequences.length ? `<ul class="account-closure-effects">${consequences.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>No workspaces or subscriptions are attached to this login.</p>'}
            <label for="account-closure-reason">Reason (optional)</label>
            <select id="account-closure-reason" name="reason">
              <option value="">Prefer not to say</option>
              <option value="not_useful">Did not provide enough value</option>
              <option value="coverage">Not enough jobs or ATS coverage</option>
              <option value="usability">Too difficult to use</option>
              <option value="price">Price</option>
              <option value="privacy">Privacy or data concerns</option>
              <option value="other">Other</option>
            </select>
            <label for="account-closure-password">Current password</label>
            <input id="account-closure-password" name="password" type="password" autocomplete="current-password" required>
            <label for="account-closure-confirm">Type <strong>${escapeHtml(data.expectedConfirmation)}</strong></label>
            <input id="account-closure-confirm" name="confirm" autocomplete="off" required>
            <label class="account-closure-check"><input name="exportAcknowledged" type="checkbox" required> I downloaded my data or choose to continue without an export.</label>
            <div class="support-form-actions"><button class="btn btn-danger" type="submit" disabled>Close account permanently</button></div>
            <div data-account-closure-result aria-live="polite"></div>
          </form>`;

        const form = panel.querySelector('[data-account-closure-form]');
        const submit = form.querySelector('button[type="submit"]');
        const syncSubmit = () => {
          submit.disabled = !form.elements.password.value
            || form.elements.confirm.value.trim() !== data.expectedConfirmation
            || !form.elements.exportAcknowledged.checked;
        };
        form.addEventListener('input', syncSubmit);
        form.addEventListener('change', syncSubmit);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          submit.disabled = true;
          submit.textContent = 'Closing account...';
          try {
            const result = await api('/api/privacy/account-closure', {
              method: 'POST',
              body: JSON.stringify({
                password: form.elements.password.value,
                confirm: form.elements.confirm.value.trim(),
                exportAcknowledged: form.elements.exportAcknowledged.checked,
                reason: form.elements.reason.value,
              }),
            });
            backdrop.remove();
            state.user = null;
            state.tenant = null;
            state.tenants = [];
            state.plan = null;
            state.trialDaysRemaining = null;
            state.referral = null;
            state.demo = false;
            state.readOnly = false;
            state.emailVerificationAvailable = false;
            state.canManageSupport = false;
            state.canManageWorkspace = false;
            state.accountClosedMessage = result.message || 'Your account has been closed.';
            state.view = 'landing';
            render();
          } catch (error) {
            submit.textContent = 'Close account permanently';
            syncSubmit();
            form.querySelector('[data-account-closure-result]').innerHTML = `<div class="support-error" role="alert"><strong>Account was not closed.</strong><p>${escapeHtml(error.message)}</p></div>`;
          }
        });
      } catch (error) {
        panel.innerHTML = `<div class="support-error" role="alert"><strong>Closure requirements could not load.</strong><p>${escapeHtml(error.message)}</p></div>`;
      }
    }

    function wireCustomerSupportForms(backdrop) {
      backdrop.querySelector('[data-support-create]')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Sending...';
        try {
          const frame = root.querySelector('.cloud-app-frame');
          const pageUrl = frame?.contentWindow?.location?.href || frame?.src || window.location.href;
          const data = await api('/api/support/tickets', {
            method: 'POST',
            body: JSON.stringify({
              category: form.elements.category.value,
              subject: form.elements.subject.value,
              body: form.elements.body.value,
              pageUrl,
            }),
          });
          await loadCustomerSupport(backdrop, data.message || 'Your request was sent.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Send request';
          form.querySelector('.support-inline-error')?.remove();
          form.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      });
      backdrop.querySelectorAll('[data-support-reply]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticketId = event.currentTarget.dataset.supportReply;
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Sending...';
        try {
          const data = await api(`/api/support/tickets/${ticketId}/messages`, {
            method: 'POST', body: JSON.stringify({ body: event.currentTarget.elements.body.value }),
          });
          await loadCustomerSupport(backdrop, data.message || 'Reply sent.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Send reply';
          event.currentTarget.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
    }

    async function loadOperatorSupport(backdrop, requestedStatus = '', notice = '') {
      setSupportTab(backdrop, 'operator');
      const body = backdrop.querySelector('[data-support-body]');
      body.innerHTML = '<div class="support-loading"><span class="btn-spinner"></span> Loading support inbox...</div>';
      try {
        const query = requestedStatus ? `?status=${encodeURIComponent(requestedStatus)}` : '';
        const data = await api('/api/support/admin/tickets' + query);
        const tickets = data.tickets || [];
        body.innerHTML = `
          ${notice ? `<div class="support-notice" role="status">${escapeHtml(notice)}</div>` : ''}
          <section class="support-operator">
            <div class="support-section-heading">
              <div><h3>Support inbox</h3><p>${tickets.length} request${tickets.length === 1 ? '' : 's'} in this view</p></div>
              <label>Filter by status
                <select data-support-filter>
                  <option value="">All requests</option>
                  ${Object.entries(supportStatusLabels).map(([value, label]) => `<option value="${value}" ${requestedStatus === value ? 'selected' : ''}>${label}</option>`).join('')}
                </select>
              </label>
            </div>
            ${tickets.length ? tickets.map((ticket, index) => supportTicketHtml(ticket, { operator: true, open: index === 0 })).join('') : '<div class="support-empty"><strong>Inbox clear</strong><p>No requests match this status.</p></div>'}
          </section>`;
        wireOperatorSupportForms(backdrop, requestedStatus);
      } catch (error) {
        if (error.code === 'step_up_required') {
          renderOperatorStepUp(backdrop, requestedStatus);
          return;
        }
        body.innerHTML = `<div class="support-error" role="alert"><strong>Support inbox could not load.</strong><p>${escapeHtml(error.message)}</p></div>`;
      }
    }

    function renderOperatorStepUp(backdrop, requestedStatus = '') {
      setSupportTab(backdrop, 'operator');
      const body = backdrop.querySelector('[data-support-body]');
      body.innerHTML = `
        <form class="support-compose" data-operator-step-up>
          <div><h3>Confirm your identity</h3><p>The support inbox contains customer information. Enter your current password to continue.</p></div>
          <label for="operator-step-up-password">Current password</label>
          <input id="operator-step-up-password" name="password" type="password" autocomplete="current-password" required autofocus>
          <div class="support-form-actions"><button class="btn btn-primary" type="submit">Continue to support inbox</button></div>
          <div data-operator-step-up-result aria-live="polite"></div>
        </form>`;
      const form = body.querySelector('[data-operator-step-up]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Confirming...';
        try {
          await api('/api/auth/step-up', {
            method: 'POST',
            body: JSON.stringify({ password: form.elements.password.value }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, 'Identity confirmed.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Continue to support inbox';
          form.querySelector('[data-operator-step-up-result]').innerHTML = `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`;
        }
      });
      form.elements.password.focus();
    }

    function wireOperatorSupportForms(backdrop, requestedStatus) {
      backdrop.querySelector('[data-support-filter]')?.addEventListener('change', (event) => loadOperatorSupport(backdrop, event.currentTarget.value));
      backdrop.querySelectorAll('[data-support-save]').forEach((button) => button.addEventListener('click', async (event) => {
        const ticket = event.currentTarget.closest('[data-support-ticket]');
        event.currentTarget.disabled = true;
        try {
          const data = await api(`/api/support/admin/tickets/${event.currentTarget.dataset.supportSave}`, {
            method: 'PATCH',
            body: JSON.stringify({
              status: ticket.querySelector('[data-ticket-status]').value,
              priority: ticket.querySelector('[data-ticket-priority]').value,
            }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, data.message || 'Request updated.');
        } catch (error) {
          event.currentTarget.disabled = false;
          ticket.querySelector('.support-inline-error')?.remove();
          ticket.querySelector('.support-ticket-detail').insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
      backdrop.querySelectorAll('[data-support-operator-reply]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
          const data = await api(`/api/support/admin/tickets/${event.currentTarget.dataset.supportOperatorReply}/messages`, {
            method: 'POST',
            body: JSON.stringify({ body: event.currentTarget.elements.body.value, internal: event.currentTarget.elements.internal.checked }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, data.message || 'Message added.');
        } catch (error) {
          button.disabled = false;
          event.currentTarget.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
    }

    function renderTrialUpgradeBanner() {
      if (!isTrialPlan()) return '';
      const trialLimits = getPlanLimits('trial');
      const creditLabel = formatCredit(state.referral?.creditAmountCents);
      const referralAction = getReferralLink() ? 'Copy referral link' : 'Referral program';
      const daysCopy = state.trialDaysRemaining !== null
        ? `${state.trialDaysRemaining} day${state.trialDaysRemaining === 1 ? '' : 's'} left`
        : '14-day trial';
      const accountLabel = state.persona === 'jobseeker' ? 'companies' : 'accounts';
      const contactLabel = state.persona === 'jobseeker' ? 'network contacts' : 'contacts';

      return `
        <div class="cloud-trial-cta" role="region" aria-label="Free trial limits and upgrade options">
          <div class="cloud-trial-cta-copy">
            <span class="cloud-trial-cta-kicker">Free trial · ${escapeHtml(daysCopy)}</span>
            <strong>Trial limits: ${formatLimit(trialLimits.jobBoards)} ATS boards, ${formatLimit(trialLimits.accounts)} ${accountLabel}, ${formatLimit(trialLimits.contacts)} ${contactLabel}.</strong>
            <span>${state.persona === 'jobseeker' ? 'Job Seeker adds a larger search workspace and 50 CSV imports.' : 'Sales Pro adds unlimited ATS boards, enrichment, and CSV export.'}</span>
          </div>
          <div class="cloud-trial-cta-actions">
            <button class="btn btn-primary btn-sm" id="cloud-upgrade-btn">Upgrade plan</button>
            <button class="btn btn-ghost btn-sm" id="cloud-referral-btn">${escapeHtml(referralAction)}</button>
            <span class="cloud-referral-note">Earn ${escapeHtml(creditLabel)} when referrals upgrade.</span>
          </div>
        </div>`;
    }

    // ── App shell — cloud topbar plus the shared BD Engine frontend ──────────
    function renderApp() {
      const planBadge = state.demo ? 'Demo' : (state.plan ? state.plan.displayName : 'Trial');
      const trialNotice = !state.demo && state.trialDaysRemaining !== null && state.trialDaysRemaining <= 14
        ? `<span class="cloud-trial-badge">${state.trialDaysRemaining}d left</span>` : '';
      const trialUpgradeBanner = state.demo
        ? `<div class="cloud-demo-banner"><strong>Read-only demo workspace</strong><span>This uses synthetic data. Create a free trial to import your own LinkedIn connections and edit records.</span><button class="btn btn-primary btn-sm" data-demo-signup>Start free trial</button></div>`
        : renderTrialUpgradeBanner();
      const verificationNotice = state.verificationMessage
        ? `<div class="cloud-account-notice" role="status"><span>${escapeHtml(state.verificationMessage)}</span><button class="cloud-notice-close" id="cloud-notice-close" type="button" aria-label="Dismiss message">Close</button></div>`
        : '';
      const emailVerified = Boolean(state.user?.emailVerifiedAt);

      root.innerHTML = `
        <div class="cloud-shell">
          <div class="cloud-topbar">
            <div class="cloud-topbar-left">
              <div class="brand-icon-xs">
                <svg width="22" height="22" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="url(#bg4)"/><path d="M7 8h6a5 5 0 010 10H7V8zm2 2v6h4a3 3 0 000-6H9z" fill="#fff"/><path d="M16 10h5a4 4 0 010 8h-5v-8zm2 2v4h3a2 2 0 000-4h-3z" fill="rgba(255,255,255,.7)"/><defs><linearGradient id="bg4" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg>
              </div>
              <span class="cloud-app-name">BD Engine <span class="brand-cloud">Cloud</span></span>
              <span class="cloud-plan-badge">${escapeHtml(planBadge)}</span>
              ${trialNotice}
            </div>
            <div class="cloud-topbar-right">
              <span class="cloud-workspace">${escapeHtml(state.tenant?.name || 'Workspace')}</span>
              <div class="cloud-user-menu" id="cloud-user-menu">
                <button class="cloud-avatar" id="cloud-avatar-btn" type="button" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="false">
                  ${(state.user?.name || 'U').charAt(0).toUpperCase()}
                </button>
                <div class="cloud-user-dropdown hidden" id="cloud-user-dropdown" role="menu">
                  <div class="cloud-user-info">
                    <strong>${escapeHtml(state.user?.name || '')}</strong>
                    <span>${escapeHtml(state.user?.email || '')}</span>
                    ${state.demo ? '' : `<span class="cloud-verification-status ${emailVerified ? 'is-verified' : ''}">${emailVerified ? 'Email verified' : 'Email not verified'}</span>`}
                  </div>
                  <hr>
                  ${state.demo ? '' : '<button class="cloud-menu-item" id="cloud-billing-btn" type="button" role="menuitem">Billing and plan</button>'}
                  ${!state.demo && state.emailVerificationAvailable && !emailVerified ? '<button class="cloud-menu-item" id="cloud-verify-email-btn" type="button" role="menuitem">Send verification email</button>' : ''}
                  <button class="cloud-menu-item" id="cloud-export-btn" type="button" role="menuitem">Privacy and data</button>
                  <button class="cloud-menu-item" id="cloud-support-btn" type="button" role="menuitem">Support center</button>
                  ${state.canManageSupport ? '<button class="cloud-menu-item" id="cloud-support-inbox-btn" type="button" role="menuitem">Support inbox</button>' : ''}
                  ${state.demo ? '<button class="cloud-menu-item" id="cloud-demo-signup-menu-btn" type="button" role="menuitem">Start free trial</button>' : '<button class="cloud-menu-item" id="cloud-referral-menu-btn" type="button" role="menuitem">Referral program</button>'}
                  <button class="cloud-menu-item" id="cloud-logout-btn" type="button" role="menuitem">Log out</button>
                </div>
              </div>
            </div>
          </div>
          ${trialUpgradeBanner}
          ${verificationNotice}
          <div class="cloud-app-container">
            <iframe class="cloud-app-frame" title="BD Engine workspace" src="/app/#/dashboard"></iframe>
          </div>
        </div>`;

      // Wire user menu
      const avatarBtn = root.querySelector('#cloud-avatar-btn');
      const dropdown = root.querySelector('#cloud-user-dropdown');
      const setUserMenuOpen = (open) => {
        dropdown?.classList.toggle('hidden', !open);
        avatarBtn?.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      avatarBtn?.addEventListener('click', () => setUserMenuOpen(dropdown?.classList.contains('hidden')));
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#cloud-user-menu')) setUserMenuOpen(false);
      });
      root.querySelector('#cloud-logout-btn')?.addEventListener('click', doLogout);
      root.querySelector('#cloud-export-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openPrivacyCenter();
      });
      root.querySelector('#cloud-verify-email-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        doRequestEmailVerification();
      });
      root.querySelector('#cloud-support-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openSupportCenter();
      });
      root.querySelector('#cloud-support-inbox-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openSupportCenter({ operator: true });
      });
      root.querySelector('#cloud-notice-close')?.addEventListener('click', () => {
        state.verificationMessage = '';
        render();
      });
      root.querySelector('[data-demo-signup]')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-demo-signup-menu-btn')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-billing-btn')?.addEventListener('click', () => {
        openBillingPage();
        setUserMenuOpen(false);
      });
      root.querySelector('#cloud-upgrade-btn')?.addEventListener('click', openBillingPage);
      root.querySelector('#cloud-referral-btn')?.addEventListener('click', (event) => copyReferralLink(event.currentTarget));
      root.querySelector('#cloud-referral-menu-btn')?.addEventListener('click', (event) => {
        copyReferralLink(event.currentTarget);
        setUserMenuOpen(false);
      });
    }

    // ── Utility ───────────────────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    // ── Init ──────────────────────────────────────────────────────────────
    render();
    checkAuth();
  })();
  </script>
</body>
</html>
