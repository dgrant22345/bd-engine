<body>
  <div id="cloud-root"></div>

  <script>
  (() => {
    const root = document.getElementById('cloud-root');
    const ONBOARDING_INTENT_STORAGE_KEY = 'bd_onboarding_intent';
    const ONBOARDING_INTENT_LEGACY_SCOPED_PREFIX = `${ONBOARDING_INTENT_STORAGE_KEY}:`;
    const ONBOARDING_INTENT_SCOPED_PREFIX = `${ONBOARDING_INTENT_STORAGE_KEY}:v2:`;
    const ONBOARDING_SCOPE_FALLBACK_MAP_KEY = 'bd_onboarding_scope_map_v2';
    const ONBOARDING_INTENT_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
    const ONBOARDING_INTENT_CLOCK_SKEW_MS = 5 * 60 * 1000;
    const ACQUISITION_STORAGE_KEY = 'bd_acquisition';
    const ACQUISITION_STORAGE_VERSION = 2;
    const PUBLIC_ACQUISITION_PATHS = new Set(['/', '/job-search', '/ats-checker']);
    const COMMERCIAL_LEGAL_VERSION = '2026-08-21';
    let anonymousOnboardingHandoffExplicit = false;

    // ── State ─────────────────────────────────────────────────────────────
    let state = {
      view: 'loading', // loading | landing | login | signup | forgot | reset | app | trust | privacy | terms | security | status
      user: null,
      tenant: null,
      tenants: [],
      plan: null,
      trialDaysRemaining: null,
      referral: null,
      demo: false,
      readOnly: false,
      error: '',
      busy: false,
      referralCode: getInitialReferralCode(),
      resetToken: getInitialResetToken(),
      resetMessage: '',
      verificationToken: getInitialVerificationToken(),
      verificationMessage: '',
      accountClosedMessage: '',
      emailVerificationAvailable: false,
      canManageSupport: false,
      canManageWorkspace: false,
      persona: 'bd',
      signupPersona: getInitialSignupPersona(),
      authDraft: {
        loginEmail: '',
        signupName: '',
        signupEmail: '',
        signupWorkspace: '',
        signupLegalAccepted: false,
      },
      onboardingIntent: getInitialOnboardingIntent(),
      onboardingIntentScope: '',
      acquisition: getInitialAcquisition(),
    };

    function getInitialReferralCode() {
      const fromUrl = new URLSearchParams(window.location.search).get('ref') || '';
      const normalized = String(fromUrl || localStorage.getItem('bd_referral_code') || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 24);
      if (normalized) localStorage.setItem('bd_referral_code', normalized);
      return normalized;
    }

    function getInitialResetToken() {
      return String(new URLSearchParams(window.location.search).get('reset') || '').trim();
    }

    function getInitialVerificationToken() {
      return String(new URLSearchParams(window.location.search).get('verify') || '').trim();
    }

    function getInitialSignupPersona() {
      const requestedPersona = new URLSearchParams(window.location.search).get('persona');
      return window.location.pathname === '/job-search' || requestedPersona === 'jobseeker' ? 'jobseeker' : 'bd';
    }

    function normalizeOnboardingPersona(value) {
      return value === 'jobseeker' ? 'jobseeker' : 'bd';
    }

    function normalizeOnboardingPlan(value) {
      return ['trial', 'sales', 'jobseeker'].includes(value) ? value : '';
    }

    function normalizeOnboardingIntent(value) {
      return ['monitor-audited-career-sites', 'monitor-career-sites', 'start-trial'].includes(value) ? value : '';
    }

    function sanitizeOnboardingCareerUrls(values) {
      if (!Array.isArray(values)) return [];
      const unique = new Set();
      for (const value of values) {
        try {
          const parsed = new URL(String(value || '').trim());
          if (!['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) continue;
          unique.add(parsed.href);
        } catch {}
        if (unique.size >= 50) break;
      }
      return [...unique];
    }

    function sanitizeOnboardingTargetSites(values) {
      if (!Array.isArray(values)) return [];
      const unique = new Set();
      for (const value of values) {
        const normalized = String(value || '').trim().slice(0, 500);
        if (normalized) unique.add(normalized);
        if (unique.size >= 50) break;
      }
      return [...unique];
    }

    function normalizePendingTargetReason(value) {
      return ['capacity', 'skipped'].includes(value) ? value : '';
    }

    function normalizeStoredOnboardingIntent(stored) {
      const updatedAt = Date.parse(stored?.updatedAt || '');
      const age = Date.now() - updatedAt;
      const isFresh = stored?.version === 1
        && Number.isFinite(updatedAt)
        && age >= -ONBOARDING_INTENT_CLOCK_SKEW_MS
        && age <= ONBOARDING_INTENT_MAX_AGE_MS;
      if (!isFresh) return null;

      const persona = normalizeOnboardingPersona(stored?.persona);
      const careerUrls = sanitizeOnboardingCareerUrls(stored?.careerUrls);
      const pendingTargetSites = sanitizeOnboardingTargetSites(stored?.pendingTargetSites);
      return {
        version: 1,
        source: ['ats-checker', 'setup-deferred', 'setup-skipped'].includes(stored?.source) ? stored.source : 'pricing',
        persona,
        intent: normalizeOnboardingIntent(stored?.intent)
          || (careerUrls.length || pendingTargetSites.length ? 'monitor-career-sites' : 'start-trial'),
        planIntent: normalizeOnboardingPlan(stored?.planIntent)
          || (persona === 'jobseeker' ? 'jobseeker' : 'trial'),
        careerUrls,
        pendingTargetSites,
        pendingTargetReason: normalizePendingTargetReason(stored?.pendingTargetReason),
        audit: stored?.audit && typeof stored.audit === 'object' ? stored.audit : undefined,
        updatedAt: stored.updatedAt,
      };
    }

    function readStoredOnboardingIntent(storage, storageKey) {
      let raw = null;
      try { raw = storage.getItem(storageKey); } catch {}
      if (!raw) return null;
      let stored = null;
      try {
        stored = JSON.parse(raw);
      } catch {
        try { storage.removeItem(storageKey); } catch {}
        return null;
      }
      const normalized = normalizeStoredOnboardingIntent(stored);
      if (!normalized) {
        try { storage.removeItem(storageKey); } catch {}
      }
      return normalized;
    }

    function writeAnonymousOnboardingIntent(intent) {
      try { sessionStorage.setItem(ONBOARDING_INTENT_STORAGE_KEY, JSON.stringify(intent)); } catch {}
      anonymousOnboardingHandoffExplicit = true;
      // Anonymous handoffs are tab-scoped. Never revive the legacy global copy.
      try { localStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY); } catch {}
    }

    function sweepStoredOnboardingIntents() {
      try {
        const scopedKeys = Object.keys(localStorage)
          .filter((key) => key.startsWith(ONBOARDING_INTENT_LEGACY_SCOPED_PREFIX));
        for (const storageKey of scopedKeys) readStoredOnboardingIntent(localStorage, storageKey);
      } catch {}
    }

    function hasExplicitOnboardingHandoff(params = new URLSearchParams(window.location.search)) {
      return params.get('signup') === '1'
        || Boolean(normalizeOnboardingIntent(params.get('intent')) || normalizeOnboardingPlan(params.get('plan')));
    }

    function isSafeAnonymousOnboardingIntent(intent) {
      return Boolean(intent && ['ats-checker', 'pricing'].includes(intent.source));
    }

    function getInitialOnboardingIntent() {
      const params = new URLSearchParams(window.location.search);
      const queryIntent = normalizeOnboardingIntent(params.get('intent'));
      const queryPlan = normalizeOnboardingPlan(params.get('plan'));
      const hasExplicitHandoff = hasExplicitOnboardingHandoff(params);
      sweepStoredOnboardingIntents();

      // Legacy localStorage was shared by every account in the browser. It has
      // no trustworthy owner, so discard it instead of attaching it to a user.
      try { localStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY); } catch {}

      let stored = hasExplicitHandoff
        ? readStoredOnboardingIntent(sessionStorage, ONBOARDING_INTENT_STORAGE_KEY)
        : null;
      if (!isSafeAnonymousOnboardingIntent(stored)) {
        stored = null;
        try { sessionStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY); } catch {}
      }
      anonymousOnboardingHandoffExplicit = hasExplicitHandoff;
      if (!stored && !hasExplicitHandoff) return null;

      const persona = normalizeOnboardingPersona(params.get('persona') || stored?.persona);
      const careerUrls = sanitizeOnboardingCareerUrls(stored?.careerUrls);
      const pendingTargetSites = sanitizeOnboardingTargetSites(stored?.pendingTargetSites);
      const intent = queryIntent
        || normalizeOnboardingIntent(stored?.intent)
        || (careerUrls.length || pendingTargetSites.length ? 'monitor-career-sites' : 'start-trial');
      const planIntent = queryPlan
        || normalizeOnboardingPlan(stored?.planIntent)
        || (persona === 'jobseeker' ? 'jobseeker' : 'trial');
      const next = {
        version: 1,
        source: stored?.source === 'ats-checker' || params.get('utm_source') === 'ats-checker' ? 'ats-checker' : 'pricing',
        persona,
        intent,
        planIntent,
        careerUrls,
        pendingTargetSites,
        pendingTargetReason: normalizePendingTargetReason(stored?.pendingTargetReason),
        audit: stored?.audit && typeof stored.audit === 'object' ? stored.audit : undefined,
        updatedAt: hasExplicitHandoff ? new Date().toISOString() : stored?.updatedAt || new Date().toISOString(),
      };
      writeAnonymousOnboardingIntent(next);
      return next;
    }

    function normalizeOnboardingIntentScopePart(value) {
      return String(value || '').trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 128);
    }

    function getLegacyAuthenticatedOnboardingIntentStorageKey(user = state.user, tenant = state.tenant) {
      const tenantId = normalizeOnboardingIntentScopePart(tenant?.id);
      const userId = normalizeOnboardingIntentScopePart(user?.id);
      return tenantId && userId ? `${ONBOARDING_INTENT_LEGACY_SCOPED_PREFIX}${tenantId}:${userId}` : '';
    }

    function readFallbackOnboardingScopeMap() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ONBOARDING_SCOPE_FALLBACK_MAP_KEY) || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch {
        try { localStorage.removeItem(ONBOARDING_SCOPE_FALLBACK_MAP_KEY); } catch {}
        return {};
      }
    }

    function getFallbackOpaqueOnboardingScope(identity) {
      const scopeMap = readFallbackOnboardingScopeMap();
      const existing = String(scopeMap[identity] || '');
      if (/^[a-zA-Z0-9_-]{20,86}$/.test(existing)) return existing;
      const randomPart = globalThis.crypto?.randomUUID?.().replace(/-/g, '')
        || `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}${Math.random().toString(36).slice(2)}`;
      const scope = `scope_${randomPart}`.slice(0, 86);
      scopeMap[identity] = scope;
      try { localStorage.setItem(ONBOARDING_SCOPE_FALLBACK_MAP_KEY, JSON.stringify(scopeMap)); } catch {}
      return scope;
    }

    async function deriveOpaqueOnboardingIntentScope(user = state.user, tenant = state.tenant) {
      const tenantId = String(tenant?.id || '').trim();
      const userId = String(user?.id || '').trim();
      if (!tenantId || !userId) return '';
      const identity = `${tenantId}\n${userId}`;
      if (globalThis.crypto?.subtle && globalThis.TextEncoder && globalThis.btoa) {
        try {
          const digest = await globalThis.crypto.subtle.digest('SHA-256', new TextEncoder().encode(identity));
          const binary = String.fromCharCode(...new Uint8Array(digest));
          return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        } catch {
          // Older embedded browsers may expose Web Crypto without supporting
          // digest. Keep the public scope opaque with a persisted random token.
        }
      }
      return getFallbackOpaqueOnboardingScope(identity);
    }

    function getAuthenticatedOnboardingIntentScope() {
      return String(state.onboardingIntentScope || '');
    }

    function getAuthenticatedOnboardingIntentStorageKey() {
      const scope = getAuthenticatedOnboardingIntentScope();
      return scope ? `${ONBOARDING_INTENT_SCOPED_PREFIX}${scope}` : '';
    }

    async function clearAuthenticatedOnboardingIntentsForUser(user, tenants = []) {
      const userId = String(user?.id || '').trim();
      if (!userId) return;
      const uniqueTenants = [...new Map(
        [state.tenant, ...(Array.isArray(tenants) ? tenants : [])]
          .filter((tenant) => tenant?.id)
          .map((tenant) => [tenant.id, tenant]),
      ).values()];
      for (const tenant of uniqueTenants) {
        const scope = await deriveOpaqueOnboardingIntentScope(user, tenant);
        if (scope) {
          try { localStorage.removeItem(`${ONBOARDING_INTENT_SCOPED_PREFIX}${scope}`); } catch {}
        }
        const legacyKey = getLegacyAuthenticatedOnboardingIntentStorageKey(user, tenant);
        if (legacyKey) {
          try { localStorage.removeItem(legacyKey); } catch {}
        }
      }
      const fallbackMap = readFallbackOnboardingScopeMap();
      let fallbackChanged = false;
      for (const identity of Object.keys(fallbackMap)) {
        if (identity.endsWith(`\n${userId}`)) {
          delete fallbackMap[identity];
          fallbackChanged = true;
        }
      }
      if (fallbackChanged) {
        try { localStorage.setItem(ONBOARDING_SCOPE_FALLBACK_MAP_KEY, JSON.stringify(fallbackMap)); } catch {}
      }
      try {
        sessionStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
        localStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
      } catch {}
    }

    function clearOnboardingHandoffQuery() {
      if (!window.history?.replaceState) return;
      const cleanUrl = new URL(window.location.href);
      ['signup', 'intent', 'plan', 'persona'].forEach((key) => cleanUrl.searchParams.delete(key));
      window.history.replaceState({}, document.title, `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
    }

    async function activateAuthenticatedOnboardingIntent() {
      state.onboardingIntentScope = await deriveOpaqueOnboardingIntentScope();
      const scopedKey = getAuthenticatedOnboardingIntentStorageKey();
      if (!scopedKey) {
        state.onboardingIntent = null;
        return '';
      }

      sweepStoredOnboardingIntents();
      const anonymousIntent = anonymousOnboardingHandoffExplicit
        ? readStoredOnboardingIntent(sessionStorage, ONBOARDING_INTENT_STORAGE_KEY)
        : null;
      let activeIntent = readStoredOnboardingIntent(localStorage, scopedKey);
      const legacyScopedKey = getLegacyAuthenticatedOnboardingIntentStorageKey();
      const legacyScopedIntent = legacyScopedKey
        ? readStoredOnboardingIntent(localStorage, legacyScopedKey)
        : null;
      if (!activeIntent && legacyScopedIntent) {
        try {
          localStorage.setItem(scopedKey, JSON.stringify(legacyScopedIntent));
          activeIntent = legacyScopedIntent;
        } catch {}
      }
      if (legacyScopedKey) {
        try { localStorage.removeItem(legacyScopedKey); } catch {}
      }
      if (isSafeAnonymousOnboardingIntent(anonymousIntent)) {
        const migratedIntent = { ...anonymousIntent, updatedAt: new Date().toISOString() };
        try {
          localStorage.setItem(scopedKey, JSON.stringify(migratedIntent));
          activeIntent = migratedIntent;
          sessionStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
          localStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
        } catch {}
      } else {
        try {
          sessionStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
          localStorage.removeItem(ONBOARDING_INTENT_STORAGE_KEY);
        } catch {}
      }
      anonymousOnboardingHandoffExplicit = false;
      state.onboardingIntent = activeIntent;
      clearOnboardingHandoffQuery();
      return state.onboardingIntentScope;
    }

    function persistOnboardingIntent(patch = {}) {
      const current = state.onboardingIntent || {};
      const persona = normalizeOnboardingPersona(patch.persona || current.persona || state.signupPersona);
      const careerUrls = sanitizeOnboardingCareerUrls(
        Object.prototype.hasOwnProperty.call(patch, 'careerUrls') ? patch.careerUrls : current.careerUrls,
      );
      const pendingTargetSites = sanitizeOnboardingTargetSites(
        Object.prototype.hasOwnProperty.call(patch, 'pendingTargetSites') ? patch.pendingTargetSites : current.pendingTargetSites,
      );
      const requestedPlan = normalizeOnboardingPlan(patch.planIntent);
      let planIntent = requestedPlan || normalizeOnboardingPlan(current.planIntent);
      if (!planIntent || (persona === 'jobseeker' && planIntent !== 'jobseeker')) {
        planIntent = persona === 'jobseeker' ? 'jobseeker' : 'trial';
      } else if (persona === 'bd' && planIntent === 'jobseeker') {
        planIntent = 'trial';
      }
      const retainsAuditSource = careerUrls.length > 0 && current.source === 'ats-checker';
      const retainedSetupSource = ['setup-deferred', 'setup-skipped'].includes(current.source) ? current.source : '';
      const next = {
        version: 1,
        source: retainsAuditSource
          ? 'ats-checker'
          : (['ats-checker', 'setup-deferred', 'setup-skipped'].includes(patch.source) ? patch.source : retainedSetupSource || 'pricing'),
        persona,
        intent: normalizeOnboardingIntent(patch.intent)
          || normalizeOnboardingIntent(current.intent)
          || (careerUrls.length || pendingTargetSites.length ? 'monitor-career-sites' : 'start-trial'),
        planIntent,
        careerUrls,
        pendingTargetSites,
        pendingTargetReason: normalizePendingTargetReason(
          Object.prototype.hasOwnProperty.call(patch, 'pendingTargetReason') ? patch.pendingTargetReason : current.pendingTargetReason,
        ),
        audit: patch.audit || current.audit,
        updatedAt: new Date().toISOString(),
      };
      state.onboardingIntent = next;
      const scopedKey = state.user && !state.demo ? getAuthenticatedOnboardingIntentStorageKey() : '';
      if (scopedKey) {
        try { localStorage.setItem(scopedKey, JSON.stringify(next)); } catch {}
      } else {
        writeAnonymousOnboardingIntent(next);
      }
      return next;
    }

    function getInitialAcquisition() {
      const params = new URLSearchParams(window.location.search);
      const hasTaggedTouch = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content']
        .some((key) => Boolean(params.get(key))) || Boolean(params.get('ref'));
      const hasExternalReferrer = (() => {
        if (!document.referrer) return false;
        try { return new URL(document.referrer).origin !== window.location.origin; } catch { return false; }
      })();
      const taggedSource = normalizeAcquisitionToken(params.get('utm_source'));
      const source = taggedSource
        || (params.get('ref') ? 'referral' : '')
        || (hasTaggedTouch ? 'campaign' : '')
        || (hasExternalReferrer ? 'referrer' : 'direct');
      const currentTouch = normalizeAcquisitionTouch({
        source,
        medium: normalizeAcquisitionToken(params.get('utm_medium')),
        campaign: normalizeAcquisitionToken(params.get('utm_campaign')),
        content: normalizeAcquisitionToken(params.get('utm_content')),
        landingPath: window.location.pathname,
        persona: window.location.pathname === '/job-search' || params.get('persona') === 'jobseeker'
          ? 'jobseeker'
          : 'bd',
      });
      if (!currentTouch.medium && ['referral', 'referrer'].includes(currentTouch.source)) {
        currentTouch.medium = 'referral';
      }

      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem(ACQUISITION_STORAGE_KEY) || '{}');
      } catch {}

      const storedLegacyTouch = normalizeAcquisitionTouch(stored);
      let firstTouch = normalizeAcquisitionTouch(stored?.firstTouch || storedLegacyTouch);
      if (!firstTouch.source) firstTouch = { ...currentTouch };
      if (!firstTouch.landingPath) firstTouch.landingPath = currentTouch.landingPath;
      if (!firstTouch.persona) firstTouch.persona = currentTouch.persona;

      let lastNonDirectTouch = normalizeAcquisitionTouch(
        stored?.lastNonDirectTouch
          || (storedLegacyTouch.source && storedLegacyTouch.source !== 'direct' ? storedLegacyTouch : {}),
      );
      if (currentTouch.source && currentTouch.source !== 'direct') {
        lastNonDirectTouch = { ...currentTouch };
      }

      const acquisition = {
        version: ACQUISITION_STORAGE_VERSION,
        firstTouch,
        lastNonDirectTouch,
      };
      try { localStorage.setItem(ACQUISITION_STORAGE_KEY, JSON.stringify(acquisition)); } catch {}
      return acquisition;
    }

    function normalizeAcquisitionTouch(value = {}) {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
      const touch = {
        source: normalizeAcquisitionToken(value.source),
        medium: normalizeAcquisitionToken(value.medium),
        campaign: normalizeAcquisitionToken(value.campaign),
        content: normalizeAcquisitionToken(value.content),
        landingPath: normalizeAcquisitionLandingPath(value.landingPath),
        persona: value.persona === 'jobseeker' ? 'jobseeker' : (value.persona === 'bd' ? 'bd' : ''),
      };
      return Object.fromEntries(Object.entries(touch).filter(([, item]) => item));
    }

    function normalizeAcquisitionLandingPath(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const pathname = new URL(raw, window.location.origin).pathname.replace(/\/+$/, '') || '/';
        return PUBLIC_ACQUISITION_PATHS.has(pathname) ? pathname : '';
      } catch {
        return '';
      }
    }

    function normalizeAcquisitionToken(value) {
      const raw = String(value || '').trim();
      if (raw.includes('@') || /(?:[a-z]+:\/\/|[\\/?#])/i.test(raw)) return '';
      return raw
        .toLowerCase()
        .replace(/[^a-z0-9_.-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^[.-]+|[.-]+$/g, '')
        .slice(0, 32);
    }

    function getAcquisitionSource() {
      const touch = state.acquisition?.lastNonDirectTouch?.source
        ? state.acquisition.lastNonDirectTouch
        : state.acquisition?.firstTouch;
      const source = normalizeAcquisitionToken(touch?.source) || 'direct';
      const campaign = normalizeAcquisitionToken(touch?.campaign);
      return (campaign && campaign !== source ? `${source}.${campaign}` : source).slice(0, 48);
    }

    // ── API helper ────────────────────────────────────────────────────────
    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        ...options,
      });
      const data = res.status === 204 ? null : await res.json();
      if (!res.ok) {
        const error = new Error(data?.error || `Request failed: ${res.status}`);
        error.code = data?.code || '';
        error.status = res.status;
        error.details = data;
        throw error;
      }
      return data;
    }

    function getVisitorId() {
      const key = 'bd_visitor_id';
      let visitorId = localStorage.getItem(key);
      if (!visitorId) {
        visitorId = crypto.randomUUID ? crypto.randomUUID() : `visitor-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(key, visitorId);
      }
      return visitorId;
    }

    async function trackAcquisitionEvent(eventType = 'pageview') {
      const payload = {
        visitorId: getVisitorId(),
        eventType,
        path: `${window.location.pathname}${window.location.hash || ''}`,
        referrer: document.referrer || '',
        source: getAcquisitionSource(),
      };
      const body = JSON.stringify(payload);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/analytics/visit', new Blob([body], { type: 'application/json' }));
        return;
      }
      await fetch('/api/analytics/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body,
        keepalive: true,
      });
    }

    async function trackPageVisit() {
      return trackAcquisitionEvent('pageview');
    }

    async function checkAuth() {
      cleanupServiceWorkers();
      trackPageVisit().catch(() => {});
      const requestedLegalView = new URLSearchParams(window.location.search).get('legal');
      if (requestedLegalView === 'terms' || requestedLegalView === 'privacy') {
        state.view = requestedLegalView;
        render();
        return;
      }
      if (state.verificationToken) {
        try {
          const verification = await api('/api/auth/email-verification/confirm', {
            method: 'POST',
            body: JSON.stringify({ token: state.verificationToken }),
          });
          state.verificationMessage = verification.message || 'Email verified.';
        } catch (error) {
          state.verificationMessage = error.message || 'This verification link is invalid or expired.';
        } finally {
          state.verificationToken = '';
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('verify');
          window.history?.replaceState?.({}, document.title, `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
        }
      }
      try {
        const data = await api('/api/auth/me');
        if (data.authenticated) {
          state.user = data.user;
          state.tenant = data.tenant;
          state.tenants = data.tenants || [];
          state.plan = data.plan;
          state.trialDaysRemaining = data.trialDaysRemaining;
          state.referral = data.referral || null;
          state.demo = Boolean(data.demo);
          state.readOnly = Boolean(data.readOnly);
          state.persona = data.persona === 'jobseeker' ? 'jobseeker' : 'bd';
          state.emailVerificationAvailable = Boolean(data.emailVerificationAvailable);
          state.canManageSupport = Boolean(data.canManageSupport);
          state.canManageWorkspace = Boolean(data.canManageWorkspace);
          const mismatchedJobSeekerDemo = state.demo
            && state.signupPersona === 'jobseeker'
            && state.persona !== 'jobseeker';
          if (mismatchedJobSeekerDemo) {
            await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
            state.user = null;
            state.tenant = null;
            state.tenants = [];
            state.plan = null;
            state.trialDaysRemaining = null;
            state.referral = null;
            state.demo = false;
            state.readOnly = false;
            state.emailVerificationAvailable = false;
            state.canManageSupport = false;
            state.canManageWorkspace = false;
            state.persona = 'jobseeker';
            state.view = 'landing';
          } else {
            if (!state.demo) await activateAuthenticatedOnboardingIntent();
            state.view = 'app';
          }
        } else if (state.resetToken) {
          state.view = 'reset';
        } else {
          const params = new URLSearchParams(window.location.search);
          state.view = params.get('login') === '1'
            ? 'login'
            : params.get('signup') === '1'
              ? 'signup'
              : 'landing';
        }
      } catch {
        const params = new URLSearchParams(window.location.search);
        state.view = state.resetToken
          ? 'reset'
          : params.get('login') === '1'
            ? 'login'
            : params.get('signup') === '1'
              ? 'signup'
              : 'landing';
      }
      render();
    }

        const response = await fetch('/api/privacy/export', { credentials: 'same-origin' });
        const data = await response.json();
        if (!response.ok) throw new Error(data?.error || `Export failed: ${response.status}`);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const slug = String(state.tenant?.slug || state.tenant?.name || 'workspace').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'workspace';
        link.href = url;
        link.download = `bd-engine-${slug}-export.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        state.error = err.message || 'Export failed.';

    function openBillingPage() {
      const frame = root.querySelector('.cloud-app-frame');
      if (!frame) return;
      // Navigate the SPA's hash in place rather than resetting src, which would
      // force a full ~373KB reload of the app on every billing click. The iframe
      // is same-origin, so hash navigation is allowed and the SPA's hashchange
      // router handles it without reloading.
      try {
        const win = frame.contentWindow;
        if (win && win.location && String(win.location.href).includes('/app/')) {
          win.location.hash = '#/admin/billing';
          return;
        }
      } catch { /* cross-origin/not-ready — fall through to full navigation */ }
      const onboardingIntentScope = getAuthenticatedOnboardingIntentScope();
      frame.src = onboardingIntentScope
        ? `/app/?intentScope=${encodeURIComponent(onboardingIntentScope)}#/admin/billing`
        : '/app/#/admin/billing';
    }

    function wirePasswordToggles(scope = root) {
      scope.querySelectorAll('[data-password-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const input = scope.querySelector(`#${CSS.escape(button.dataset.passwordToggle || '')}`);
          if (!(input instanceof HTMLInputElement)) return;
          const reveal = input.type === 'password';
          input.type = reveal ? 'text' : 'password';
          button.textContent = reveal ? 'Hide' : 'Show';
          button.setAttribute('aria-label', `${reveal ? 'Hide' : 'Show'} password`);
          button.setAttribute('aria-pressed', reveal ? 'true' : 'false');
        });
      });
    }

      const preparedTargetCount = Math.max(onboardingUrlCount, pendingTargetCount);
      const selectedPlanLabel = {
        sales: 'Sales Professional',

      if (intent.source === 'ats-checker' && onboardingUrlCount) {
        return `<div class="auth-error auth-notice--intent" role="status"><strong>Your audit is ready.</strong> ${onboardingUrlCount} ${onboardingUrlCount === 1 ? 'career site' : 'career sites'} will be ready to add during setup.</div>`;

      if (['setup-deferred', 'setup-skipped'].includes(intent.source) && preparedTargetCount) {
        const targetLabel = preparedTargetCount === 1 ? 'target' : 'targets';
        const reason = intent.pendingTargetReason === 'capacity'
          ? 'They were held because setup reached an account limit. The active workspace plan will determine how many can be added.'
          : 'They were saved when setup was skipped and remain available to add later.';
        return `<div class="auth-error auth-notice--intent" role="status"><strong>${preparedTargetCount} saved ${targetLabel} found.</strong> ${reason}</div>`;
      }
      if (preparedTargetCount) {

        return `<div class="auth-error auth-notice--intent" role="status"><strong>Your target list is ready.</strong> ${preparedTargetCount} ${targetLabel} will be available during setup.</div>`;

    const supportStatusLabels = {
      new: 'New',
      open: 'In progress',
      waiting_on_customer: 'Waiting for you',
      resolved: 'Resolved',
      closed: 'Closed',
    };

    const supportCategoryLabels = {
      job_discovery: 'Job and ATS discovery',
      data_import: 'Import or data issue',
      outreach: 'Outreach drafts',
      billing: 'Billing or subscription',

      feedback: 'Product feedback',

    function formatSupportDate(value) {
      const date = new Date(value || '');
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function supportMessagesHtml(messages = []) {
      return messages.map((message) => `
        <div class="support-message ${message.authorType === 'support' ? 'is-support' : ''} ${message.internal ? 'is-internal' : ''}">
          <div class="support-message-meta">
            <strong>${message.internal ? 'Internal note' : (message.authorType === 'support' ? 'BD Engine support' : 'You')}</strong>
            <span>${escapeHtml(formatSupportDate(message.createdAt))}</span>
          </div>
          <p>${escapeHtml(message.body).replace(/\n/g, '<br>')}</p>
        </div>`).join('');
    }

    function supportTicketHtml(ticket, { operator = false, open = false } = {}) {
      const status = supportStatusLabels[ticket.status] || ticket.status || 'New';

      const requester = operator
        ? `<span>${escapeHtml(ticket.requester?.email || ticket.createdByUserId || 'Unknown requester')} · ${escapeHtml(ticket.workspaceName || ticket.tenantId || '')}</span>`

          <label>Status

            </select>
          </label>

            <select data-ticket-priority>

    async function loadAccountClosure(backdrop) {
      const panel = backdrop.querySelector('[data-account-closure]');

      try {
        const data = await api('/api/privacy/account-closure');
        if (!data.eligible) {

          ...(data.leaveWorkspaces || []).map((item) => `Leave workspace: ${item.name}`),
          ...(data.subscriptionsToCancel ? [`Cancel ${data.subscriptionsToCancel} active subscription${data.subscriptionsToCancel === 1 ? '' : 's'}`] : []),

        panel.innerHTML = `

      }
    }

    function getSanitizedSupportPageUrl(frame) {
      let candidate = window.location.href;
      try {
        candidate = frame?.contentWindow?.location?.href || frame?.src || candidate;
      } catch {
        candidate = window.location.href;
      }
      let page;
      try {
        page = new URL(candidate, window.location.origin);
      } catch {
        page = new URL(window.location.pathname, window.location.origin);
      }
      if (page.origin !== window.location.origin) {
        page = new URL(window.location.pathname, window.location.origin);
      }
      // Query parameters can contain the opaque workspace scope or auth-flow
      // tokens. The route hash is enough context for support triage.
      page.search = '';
      let pageUrl = `${page.origin}${page.pathname}${page.hash}`;
      for (const rawId of [state.tenant?.id, state.user?.id]) {
        const normalizedId = String(rawId || '').trim();
        if (!normalizedId) continue;
        for (const representation of [normalizedId, encodeURIComponent(normalizedId)]) {
          pageUrl = pageUrl.split(representation).join('[redacted]');
        }
      }
      return pageUrl.slice(0, 500);
    }

    function wireCustomerSupportForms(backdrop) {

        event.preventDefault();

        button.disabled = true;
        button.textContent = 'Sending...';
        try {
          const frame = root.querySelector('.cloud-app-frame');
          const pageUrl = getSanitizedSupportPageUrl(frame);
          const data = await api('/api/support/tickets', {
            method: 'POST',
            body: JSON.stringify({
              category: form.elements.category.value,
              subject: form.elements.subject.value,
              body: form.elements.body.value,
              pageUrl,
            }),
          });
          await loadCustomerSupport(backdrop, data.message || 'Your request was sent.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Send request';
          form.querySelector('.support-inline-error')?.remove();
          form.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      });
      backdrop.querySelectorAll('[data-support-reply]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticketId = event.currentTarget.dataset.supportReply;
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Sending...';
        try {
          const data = await api(`/api/support/tickets/${ticketId}/messages`, {
            method: 'POST', body: JSON.stringify({ body: event.currentTarget.elements.body.value }),
          });
          await loadCustomerSupport(backdrop, data.message || 'Reply sent.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Send reply';
          event.currentTarget.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
    }

    async function loadOperatorSupport(backdrop, requestedStatus = '', notice = '') {
      setSupportTab(backdrop, 'operator');
      const body = backdrop.querySelector('[data-support-body]');
      body.innerHTML = '<div class="support-loading"><span class="btn-spinner"></span> Loading support inbox...</div>';
      try {
        const query = requestedStatus ? `?status=${encodeURIComponent(requestedStatus)}` : '';
        const data = await api('/api/support/admin/tickets' + query);
        const tickets = data.tickets || [];
        body.innerHTML = `
          ${notice ? `<div class="support-notice" role="status">${escapeHtml(notice)}</div>` : ''}
          <section class="support-operator">
            <div class="support-section-heading">
              <div><h3>Support inbox</h3><p>${tickets.length} request${tickets.length === 1 ? '' : 's'} in this view</p></div>
              <label>Filter by status
                <select data-support-filter>
                  <option value="">All requests</option>
                  ${Object.entries(supportStatusLabels).map(([value, label]) => `<option value="${value}" ${requestedStatus === value ? 'selected' : ''}>${label}</option>`).join('')}
                </select>
              </label>
            </div>
            ${tickets.length ? tickets.map((ticket, index) => supportTicketHtml(ticket, { operator: true, open: index === 0 })).join('') : '<div class="support-empty"><strong>Inbox clear</strong><p>No requests match this status.</p></div>'}
          </section>`;
        wireOperatorSupportForms(backdrop, requestedStatus);
      } catch (error) {
        if (error.code === 'step_up_required') {
          renderOperatorStepUp(backdrop, requestedStatus);
          return;
        }
        body.innerHTML = `<div class="support-error" role="alert"><strong>Support inbox could not load.</strong><p>${escapeHtml(error.message)}</p></div>`;
      }
    }

    function renderOperatorStepUp(backdrop, requestedStatus = '') {
      setSupportTab(backdrop, 'operator');
      const body = backdrop.querySelector('[data-support-body]');
      body.innerHTML = `
        <form class="support-compose" data-operator-step-up>
          <div><h3>Confirm your identity</h3><p>The support inbox contains customer information. Enter your current password to continue.</p></div>
          <label for="operator-step-up-password">Current password</label>
          <input id="operator-step-up-password" name="password" type="password" autocomplete="current-password" required autofocus>
          <div class="support-form-actions"><button class="btn btn-primary" type="submit">Continue to support inbox</button></div>
          <div data-operator-step-up-result aria-live="polite"></div>
        </form>`;
      const form = body.querySelector('[data-operator-step-up]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Confirming...';
        try {
          await api('/api/auth/step-up', {
            method: 'POST',
            body: JSON.stringify({ password: form.elements.password.value }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, 'Identity confirmed.');
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Continue to support inbox';
          form.querySelector('[data-operator-step-up-result]').innerHTML = `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`;
        }
      });
      form.elements.password.focus();
    }

    function wireOperatorSupportForms(backdrop, requestedStatus) {
      backdrop.querySelector('[data-support-filter]')?.addEventListener('change', (event) => loadOperatorSupport(backdrop, event.currentTarget.value));
      backdrop.querySelectorAll('[data-support-save]').forEach((button) => button.addEventListener('click', async (event) => {
        const ticket = event.currentTarget.closest('[data-support-ticket]');
        event.currentTarget.disabled = true;
        try {
          const data = await api(`/api/support/admin/tickets/${event.currentTarget.dataset.supportSave}`, {
            method: 'PATCH',
            body: JSON.stringify({
              status: ticket.querySelector('[data-ticket-status]').value,
              priority: ticket.querySelector('[data-ticket-priority]').value,
            }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, data.message || 'Request updated.');
        } catch (error) {
          event.currentTarget.disabled = false;
          ticket.querySelector('.support-inline-error')?.remove();
          ticket.querySelector('.support-ticket-detail').insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
      backdrop.querySelectorAll('[data-support-operator-reply]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
          const data = await api(`/api/support/admin/tickets/${event.currentTarget.dataset.supportOperatorReply}/messages`, {
            method: 'POST',
            body: JSON.stringify({ body: event.currentTarget.elements.body.value, internal: event.currentTarget.elements.internal.checked }),
          });
          await loadOperatorSupport(backdrop, requestedStatus, data.message || 'Message added.');
        } catch (error) {
          button.disabled = false;
          event.currentTarget.insertAdjacentHTML('beforeend', `<p class="support-inline-error" role="alert">${escapeHtml(error.message)}</p>`);
        }
      }));
    }

    function renderTrialUpgradeBanner() {
      if (!isTrialPlan()) return '';
      const trialLimits = getPlanLimits('trial');
      const daysCopy = state.trialDaysRemaining !== null
        ? `${state.trialDaysRemaining} day${state.trialDaysRemaining === 1 ? '' : 's'} left`
        : '14-day trial';
      const accountLabel = state.persona === 'jobseeker' ? 'companies' : 'accounts';
      const contactLabel = state.persona === 'jobseeker' ? 'network contacts' : 'contacts';

      return `
        <div class="cloud-trial-cta" role="region" aria-label="Free trial limits and upgrade options">
          <div class="cloud-trial-cta-copy">
            <span class="cloud-trial-cta-kicker">Free trial · ${escapeHtml(daysCopy)}</span>
            <strong>Trial limits: ${formatLimit(trialLimits.jobBoards)} ATS boards, ${formatLimit(trialLimits.accounts)} ${accountLabel}, ${formatLimit(trialLimits.contacts)} ${contactLabel}.</strong>
            <span>${state.persona === 'jobseeker' ? 'Job Seeker adds a larger search workspace and 50 CSV imports.' : 'Sales Pro adds unlimited ATS boards, enrichment, and CSV export.'}</span>
          </div>
          <div class="cloud-trial-cta-actions">
            <button class="btn btn-primary btn-sm" id="cloud-upgrade-btn">Upgrade plan</button>
          </div>
        </div>`;
    }

    // ── App shell — cloud topbar plus the shared BD Engine frontend ──────────
    function renderApp() {
      const planBadge = state.demo ? 'Demo' : (state.plan ? state.plan.displayName : 'Trial');
      const onboardingIntentScope = getAuthenticatedOnboardingIntentScope();
      const appFrameSrc = onboardingIntentScope
        ? `/app/?intentScope=${encodeURIComponent(onboardingIntentScope)}#/dashboard`
        : '/app/#/dashboard';
      const trialNotice = !state.demo && state.trialDaysRemaining !== null && state.trialDaysRemaining <= 14
        ? `<span class="cloud-trial-badge">${state.trialDaysRemaining}d left</span>` : '';
      const trialUpgradeBanner = state.demo
        ? `<div class="cloud-demo-banner"><strong>Read-only demo workspace</strong><span>This uses synthetic data. Create a free trial to import your own LinkedIn connections and edit records.</span><button class="btn btn-primary btn-sm" data-demo-signup>Start free trial</button></div>`
        : renderTrialUpgradeBanner();
      const verificationNotice = state.verificationMessage
        ? `<div class="cloud-account-notice" role="status"><span>${escapeHtml(state.verificationMessage)}</span><button class="cloud-notice-close" id="cloud-notice-close" type="button" aria-label="Dismiss message">Close</button></div>`
        : '';
      const emailVerified = Boolean(state.user?.emailVerifiedAt);

      root.innerHTML = `
        <div class="cloud-shell">
          <div class="cloud-topbar">
            <div class="cloud-topbar-left">
              <div class="brand-icon-xs">
                <svg width="22" height="22" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="url(#bg4)"/><path d="M7 8h6a5 5 0 010 10H7V8zm2 2v6h4a3 3 0 000-6H9z" fill="#fff"/><path d="M16 10h5a4 4 0 010 8h-5v-8zm2 2v4h3a2 2 0 000-4h-3z" fill="rgba(255,255,255,.7)"/><defs><linearGradient id="bg4" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs></svg>
              </div>
              <span class="cloud-app-name">BD Engine <span class="brand-cloud">Cloud</span></span>
              <span class="cloud-plan-badge">${escapeHtml(planBadge)}</span>
              ${trialNotice}
            </div>
            <div class="cloud-topbar-right">
              <span class="cloud-workspace">${escapeHtml(state.tenant?.name || 'Workspace')}</span>
              <div class="cloud-user-menu" id="cloud-user-menu">
                <button class="cloud-avatar" id="cloud-avatar-btn" type="button" aria-label="Open account menu" aria-haspopup="menu" aria-expanded="false">
                  ${(state.user?.name || 'U').charAt(0).toUpperCase()}
                </button>
                <div class="cloud-user-dropdown hidden" id="cloud-user-dropdown" role="menu">
                  <div class="cloud-user-info">
                    <strong>${escapeHtml(state.user?.name || '')}</strong>
                    <span>${escapeHtml(state.user?.email || '')}</span>
                    ${state.demo ? '' : `<span class="cloud-verification-status ${emailVerified ? 'is-verified' : ''}">${emailVerified ? 'Email verified' : 'Email not verified'}</span>`}
                  </div>
                  <hr>
                  ${state.demo ? '' : '<button class="cloud-menu-item" id="cloud-billing-btn" type="button" role="menuitem">Billing and plan</button>'}
                  ${!state.demo && state.emailVerificationAvailable && !emailVerified ? '<button class="cloud-menu-item" id="cloud-verify-email-btn" type="button" role="menuitem">Send verification email</button>' : ''}
                  <button class="cloud-menu-item" id="cloud-export-btn" type="button" role="menuitem">Privacy and data</button>
                  <button class="cloud-menu-item" id="cloud-support-btn" type="button" role="menuitem">Support center</button>
                  ${state.canManageSupport ? '<button class="cloud-menu-item" id="cloud-support-inbox-btn" type="button" role="menuitem">Support inbox</button>' : ''}
                  ${state.demo ? '<button class="cloud-menu-item" id="cloud-demo-signup-menu-btn" type="button" role="menuitem">Start free trial</button>' : ''}
                  <button class="cloud-menu-item" id="cloud-logout-btn" type="button" role="menuitem">Log out</button>
                </div>
              </div>
            </div>
          </div>
          ${trialUpgradeBanner}
          ${verificationNotice}
          <div class="cloud-app-container">
            <iframe class="cloud-app-frame" title="BD Engine workspace" src="${appFrameSrc}"></iframe>
          </div>
        </div>`;

      // Wire user menu
      const avatarBtn = root.querySelector('#cloud-avatar-btn');
      const dropdown = root.querySelector('#cloud-user-dropdown');
      const setUserMenuOpen = (open) => {
        dropdown?.classList.toggle('hidden', !open);
        avatarBtn?.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      avatarBtn?.addEventListener('click', () => setUserMenuOpen(dropdown?.classList.contains('hidden')));
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#cloud-user-menu')) setUserMenuOpen(false);
      });
      root.querySelector('#cloud-logout-btn')?.addEventListener('click', doLogout);
      root.querySelector('#cloud-export-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openPrivacyCenter();
      });
      root.querySelector('#cloud-verify-email-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        doRequestEmailVerification();
      });
      root.querySelector('#cloud-support-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openSupportCenter();
      });
      root.querySelector('#cloud-support-inbox-btn')?.addEventListener('click', () => {
        setUserMenuOpen(false);
        openSupportCenter({ operator: true });
      });
      root.querySelector('#cloud-notice-close')?.addEventListener('click', () => {
        state.verificationMessage = '';
        render();
      });
      root.querySelector('[data-demo-signup]')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-demo-signup-menu-btn')?.addEventListener('click', exitDemoToSignup);
      root.querySelector('#cloud-billing-btn')?.addEventListener('click', () => {
        openBillingPage();
        setUserMenuOpen(false);
      });
      root.querySelector('#cloud-upgrade-btn')?.addEventListener('click', openBillingPage);
    }

    // ── Utility ───────────────────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── Init ──────────────────────────────────────────────────────────────
    render();
    checkAuth();
  })();
  </script>
</body>
</html>
