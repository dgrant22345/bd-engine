name: Production read-only probe

on:
  workflow_call:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-read-only-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Production availability and trust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: saas
    env:
      BD_CLOUD_SMOKE_URL: ${{ vars.BD_PRODUCTION_URL || 'https://bd-engine-production.up.railway.app' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: deploy/perf-restore

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run non-mutating production smoke checks
        run: npm run smoke
