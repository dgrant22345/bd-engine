name: Production read-only probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-read-only-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Production availability and trust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: saas
    env:
      BD_CLOUD_SMOKE_URL: ${{ vars.BD_PRODUCTION_URL || 'https://bd-engine-production.up.railway.app' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run non-mutating production smoke checks
        run: npm run smoke
