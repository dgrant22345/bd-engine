name: ATS live canary

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1,4'

permissions:
  contents: read

concurrency:
  group: ats-live-canary
  cancel-in-progress: true

jobs:
  provider-compatibility:
    name: Public provider compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check live public ATS boards
        run: npm run benchmark:ats:live
