name: ATS live canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1,4'

jobs:
  provider-compatibility:
    name: Public provider compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check live public ATS boards
        run: npm run benchmark:ats:live
