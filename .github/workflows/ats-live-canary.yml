name: ATS live canary

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1,4'

permissions:
  contents: read

concurrency:
  group: ats-live-canary
  cancel-in-progress: true

jobs:
  provider-compatibility:
    name: Public provider compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: deploy/perf-restore

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check live public ATS boards
        run: npm run benchmark:ats:live
