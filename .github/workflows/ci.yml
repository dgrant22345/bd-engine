name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - deploy/perf-restore

permissions:
  contents: read

jobs:
  renderer-checks:
    name: ATS renderer checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: renderer

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development toolchain
        run: npm audit --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Contract and security tests
        run: npm test

  saas-checks:
    name: SaaS checks and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development toolchain
        run: npm audit --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Correctness lint
        run: npm run lint

      - name: Schema migration contract
        run: npm run check:schema

      - name: Unit tests
        run: npm test

      - name: Start local SaaS server
        env:
          BD_CLOUD_PORT: 8787
          BD_CLOUD_HOST: 127.0.0.1
          NODE_ENV: test
          SESSION_SECRET: ci-session-secret-with-enough-length
        run: |
          npm run start > ../ci-server.log 2>&1 &
          echo $! > ../ci-server.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat ../ci-server.pid)" 2>/dev/null; then
              cat ../ci-server.log
              exit 1
            fi
            sleep 0.5
          done
          cat ../ci-server.log
          exit 1

      - name: Smoke test
        env:
          BD_CLOUD_SMOKE_URL: http://127.0.0.1:8787
        run: npm run smoke

      - name: Show server log on failure
        if: failure()
        run: cat ../ci-server.log || true

      - name: Stop local SaaS server
        if: always()
        run: |
          if [ -f ../ci-server.pid ]; then
            kill "$(cat ../ci-server.pid)" 2>/dev/null || true
          fi

  recovery-drill:
    name: PostgreSQL recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bd_engine_recovery_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bd_engine_recovery_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify relational job pagination and filter parity
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bd_engine_recovery_source
          DB_SSL: "false"
          NODE_ENV: test
        run: npm run verify:job-queries

      - name: Run encrypted backup and restore drill
        env:
          RECOVERY_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bd_engine_recovery_source
          DB_SSL: "false"
          NODE_ENV: test
        run: npm run test:recovery

  browser-journeys:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser journey tests
        run: npm run test:browser

      - name: Accessibility tests
        run: npm run test:accessibility

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: saas/test-results/
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Compatibility journey
        run: npx playwright test test/browser/compatibility.spec.mjs --project=${{ matrix.browser }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.browser }}-traces
          path: saas/test-results/
          retention-days: 7
