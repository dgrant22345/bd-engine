name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - deploy/perf-restore

jobs:
  renderer-checks:
    name: ATS renderer checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: renderer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Contract and security tests
        run: npm test

  saas-checks:
    name: SaaS checks and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Start local SaaS server
        env:
          BD_CLOUD_PORT: 8787
          BD_CLOUD_HOST: 127.0.0.1
          NODE_ENV: test
          SESSION_SECRET: ci-session-secret-with-enough-length
        run: |
          npm run start > ../ci-server.log 2>&1 &
          echo $! > ../ci-server.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat ../ci-server.pid)" 2>/dev/null; then
              cat ../ci-server.log
              exit 1
            fi
            sleep 0.5
          done
          cat ../ci-server.log
          exit 1

      - name: Smoke test
        env:
          BD_CLOUD_SMOKE_URL: http://127.0.0.1:8787
        run: npm run smoke

      - name: Show server log on failure
        if: failure()
        run: cat ../ci-server.log || true

      - name: Stop local SaaS server
        if: always()
        run: |
          if [ -f ../ci-server.pid ]; then
            kill "$(cat ../ci-server.pid)" 2>/dev/null || true
          fi

  browser-journeys:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser journey tests
        run: npm run test:browser

      - name: Accessibility tests
        run: npm run test:accessibility

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: saas/test-results/
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    defaults:
      run:
        working-directory: saas

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Compatibility journey
        run: npx playwright test test/browser/compatibility.spec.mjs --project=${{ matrix.browser }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-traces
          path: saas/test-results/
          retention-days: 7
